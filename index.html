<ul><li><b>بصيغة صريحة</b> ${M(`${un} = f(n)`)}: نحسب أيّ حدّ مباشرة. مثال: ${M(`${un} = 2n² − 1`)}، ومنه ${M(`${U(3)} = 2 × 9 − 1 = 17`)}.</li>
<li><b>بعلاقة تراجعية</b> ${M(`${un1} = f(${un})`)} مع حدّ أوّل معلوم: كلّ حدّ يُحسب من الذي قبله. مثال: ${M(`${u0} = 2`)} و ${M(`${un1} = 3${un} − 1`)}، ومنه ${M(`${U(1)} = 5`)} ثمّ ${M(`${U(2)} = 14`)}. ولحساب ${M(U(10))} يجب المرور بكلّ الحدود السابقة.</li></ul>
<div class="warn"><b>انتبه:</b> ${M(un1)} هو الحدّ الموالي، وليس ${M(`${un} + 1`)}. مثلا إذا كان ${M(`${un} = n²`)} فإنّ ${M(`${un1} = (n + 1)² = n² + 2n + 1`)}، بينما ${M(`${un} + 1 = n² + 1`)}.</div></div>

<div class="card"><h3>٢) اتجاه تغيّر متتالية — المتتاليات المحدودة</h3>
<div class="rule">نقول إنّ ${M(S)} <b>متزايدة تماما</b> إذا كان من أجل كلّ ${M('n')}: ${M(`${un1} > ${un}`)}، و<b>متناقصة تماما</b> إذا كان ${M(`${un1} < ${un}`)}، و<b>ثابتة</b> إذا كان ${M(`${un1} = ${un}`)}. والمتتالية المتزايدة أو المتناقصة تُسمّى <b>رتيبة</b>.</div>
<p>ثلاث طرق لدراسة اتجاه التغيّر:</p>
<ol class="steps"><li>ندرس <b>إشارة الفرق</b> ${M(`${un1} − ${un}`)}، وهي الطريقة الأكثر استعمالا.</li>
<li>إذا كانت كلّ الحدود <b>موجبة تماما</b>، نقارن ${M(f(un1,un))} بالعدد ${M('1')}.</li>
<li>إذا كان ${M(`${un} = f(n)`)}، فإنّ اتجاه تغيّر الدالة ${M('f')} على ${M('[0 ; +∞[')} يعطي اتجاه تغيّر المتتالية.</li></ol>
<div class="ex"><b>مثال:</b> ${M(`${un} = n² − 4n`)}. ${M(`${un1} − ${un} = (n + 1)² − 4(n + 1) − n² + 4n = 2n − 3`)}. هذا الفرق موجب تماما من أجل ${M('n ≥ 2')}: المتتالية متزايدة تماما ابتداءً من الرتبة ${M('2')}.</div>
<div class="rule">${M(S)} <b>محدودة من الأعلى</b> بالعدد ${M('M')} إذا كان ${M(`${un} ≤ M`)} من أجل كلّ ${M('n')}، و<b>محدودة من الأسفل</b> بالعدد ${M('m')} إذا كان ${M(`${un} ≥ m`)} من أجل كلّ ${M('n')}، و<b>محدودة</b> إذا كانت محدودة من الأعلى ومن الأسفل.</div>
<div class="ex"><b>مثال:</b> ${M(`${un} = 3 − ${f('1','n + 1')}`)}. بما أنّ ${M(`0 < ${f('1','n + 1')} ≤ 1`)} فإنّ ${M(`2 ≤ ${un} < 3`)}: المتتالية محدودة.</div></div>

<div class="card"><h3>٣) الاستدلال بالتراجع</h3>
<div class="rule">لإثبات أنّ خاصية ${M('P(n)')} صحيحة من أجل كلّ عدد طبيعي ${M('n ≥ n<sub>0</sub>')}:
<ol class="steps"><li><b>التحقّق:</b> نتحقّق أنّ ${M('P(n<sub>0</sub>)')} صحيحة.</li>
<li><b>الوراثة:</b> نفرض أنّ ${M('P(n)')} صحيحة من أجل عدد طبيعي كيفي ${M('n ≥ n<sub>0</sub>')}، ونبرهن أنّ ${M('P(n + 1)')} صحيحة.</li>
<li><b>الخلاصة:</b> ${M('P(n)')} صحيحة من أجل كلّ ${M('n ≥ n<sub>0</sub>')}.</li></ol></div>
<div class="ex"><b>مثال:</b> ${M(`${u0} = 1`)} و ${M(`${un1} = ${h}${un} + 2`)}. نبرهن أنّ ${M(`0 ≤ ${un} ≤ 4`)} من أجل كلّ عدد طبيعي ${M('n')}.<br>
• <b>التحقّق:</b> ${M(`${u0} = 1`)} و ${M('0 ≤ 1 ≤ 4')}.<br>
• <b>الوراثة:</b> نفرض ${M(`0 ≤ ${un} ≤ 4`)}. نضرب في ${M(h)} وهو موجب: ${M(`0 ≤ ${h}${un} ≤ 2`)}، ثمّ نضيف ${M('2')}: ${M(`2 ≤ ${un1} ≤ 4`)}، إذن ${M(`0 ≤ ${un1} ≤ 4`)}.<br>
• <b>الخلاصة:</b> من أجل كلّ عدد طبيعي ${M('n')}: ${M(`0 ≤ ${un} ≤ 4`)}.</div>
<div class="warn"><b>الوراثة وحدها لا تكفي:</b> الخاصية «${M('10<sup>n</sup> + 1')} مضاعف للعدد ${M('9')}» وراثية: إذا كان ${M('10<sup>n</sup> + 1 = 9k')} فإنّ ${M('10<sup>n+1</sup> + 1 = 9(10k − 1)')}. لكنّها خاطئة دائما، فمثلا ${M('10<sup>0</sup> + 1 = 2')}. التحقّق خطوة إلزامية.</div></div>

<div class="card"><h3>٤) المتتاليات الحسابية</h3>
<div class="rule"><b>تعريف:</b> ${M(S)} متتالية حسابية إذا وُجد عدد حقيقي ${M('r')} بحيث من أجل كلّ ${M('n')}: ${M(`${un1} = ${un} + r`)}. العدد ${M('r')} هو <b>أساس</b> المتتالية.</div>
<div class="rule"><b>الحدّ العام:</b> ${M(`${un} = ${u0} + nr`)}، وبصفة عامّة ${M(`${un} = ${U('p')} + (n − p)r`)}.</div>
<div class="ex"><b>مثال:</b> ${M(`${u0} = 7`)} و ${M('r = −3')}: ${M(`${un} = 7 − 3n`)}، ومنه ${M(`${U(20)} = 7 − 60 = −53`)}.</div>
<p><b>اتجاه التغيّر:</b> ${M(`${un1} − ${un} = r`)}، فالمتتالية متزايدة تماما إذا كان ${M('r > 0')}، ومتناقصة تماما إذا كان ${M('r < 0')}، وثابتة إذا كان ${M('r = 0')}.</p>
<div class="rule"><b>مجموع حدود متتابعة:</b> ${M(`S = ${U('p')} + ${U('p+1')} + … + ${un} = (n − p + 1) × ${f(`${U('p')} + ${un}`,'2')}`)}<br>
أي: <b>عدد الحدود × (الحدّ الأوّل + الحدّ الأخير) ÷ 2</b>. وحالة خاصة: ${M(`1 + 2 + … + n = ${f('n(n + 1)','2')}`)}.</div>
<div class="ex">${M(`1 + 2 + … + 100 = ${f('100 × 101','2')} = 5050`)}.</div>
<div class="rule"><b>الوسط الحسابي:</b> الأعداد ${M('a')} ، ${M('b')} ، ${M('c')} حدود متتابعة لمتتالية حسابية إذا وفقط إذا كان ${M('2b = a + c')}.</div></div>

<div class="card"><h3>٥) المتتاليات الهندسية</h3>
<div class="rule"><b>تعريف:</b> ${M(S)} متتالية هندسية إذا وُجد عدد حقيقي ${M('q')} بحيث من أجل كلّ ${M('n')}: ${M(`${un1} = q × ${un}`)}. العدد ${M('q')} هو <b>أساس</b> المتتالية.</div>
<div class="rule"><b>الحدّ العام:</b> ${M(`${un} = ${u0} × q<sup>n</sup>`)}، وبصفة عامّة ${M(`${un} = ${U('p')} × q<sup>n−p</sup>`)}.</div>
<div class="ex"><b>مثال:</b> ${M(`${u0} = 5`)} و ${M('q = 2')}: ${M(`${un} = 5 × 2<sup>n</sup>`)}، ومنه ${M(`${U(6)} = 5 × 64 = 320`)}.</div>
<p><b>اتجاه التغيّر</b> في حالة ${M(`${u0} > 0`)}: إذا كان ${M('q > 1')} فهي متزايدة تماما، وإذا كان ${M('0 < q < 1')} فهي متناقصة تماما، وإذا كان ${M('q = 1')} فهي ثابتة، وإذا كان ${M('q < 0')} فإشارات الحدود تتناوب والمتتالية ليست رتيبة. وإذا كان ${M(`${u0} < 0`)} ينعكس الاتجاهان.</p>
<div class="rule"><b>مجموع حدود متتابعة</b> (${M('q ≠ 1')}): ${M(`S = ${U('p')} + … + ${un} = ${U('p')} × ${f('1 − q<sup>n−p+1</sup>','1 − q')}`)}<br>
أي: <b>الحدّ الأوّل × (1 − الأساس<sup>عدد الحدود</sup>) ÷ (1 − الأساس)</b>. وحالة خاصة: ${M(`1 + q + … + q<sup>n</sup> = ${f('1 − q<sup>n+1</sup>','1 − q')}`)}.</div>
<div class="ex">${M(`1 + 2 + 4 + … + 2<sup>9</sup> = ${f('1 − 2<sup>10</sup>','1 − 2')} = 1023`)}.</div>
<div class="rule"><b>الوسط الهندسي:</b> الأعداد غير المعدومة ${M('a')} ، ${M('b')} ، ${M('c')} حدود متتابعة لمتتالية هندسية إذا وفقط إذا كان ${M('b² = ac')}.</div></div>

<div class="card"><h3>٦) نهاية متتالية — التقارب</h3>
<div class="rule">نقول إنّ ${M(S)} <b>متقاربة</b> نحو العدد الحقيقي ${M('ℓ')} إذا أصبحت حدودها قريبة من ${M('ℓ')} بالقدر الذي نريد ابتداءً من رتبة معيّنة، ونكتب ${M(`${LIM}${un} = ℓ`)}. وإلّا فهي <b>متباعدة</b>: نهايتها ${M('+∞')} أو ${M('−∞')}، أو ليست لها نهاية.</div>
<div class="rule"><b>نهاية ${M('q<sup>n</sup>')}:</b><br>
• إذا كان ${M('q > 1')}: ${M(`${LIM}q<sup>n</sup> = +∞`)}<br>
• إذا كان ${M('q = 1')}: ${M('q<sup>n</sup> = 1')}<br>
• إذا كان ${M('−1 < q < 1')}: ${M(`${LIM}q<sup>n</sup> = 0`)}<br>
• إذا كان ${M('q ≤ −1')}: المتتالية ${M('(q<sup>n</sup>)')} ليست لها نهاية.</div>
<div class="rule"><b>مبرهنة التقارب الرتيب:</b> كلّ متتالية <b>متزايدة ومحدودة من الأعلى</b> متقاربة، وكلّ متتالية <b>متناقصة ومحدودة من الأسفل</b> متقاربة. أمّا المتتالية المتزايدة غير المحدودة من الأعلى فتؤول إلى ${M('+∞')}.</div>
<div class="rule"><b>المقارنة:</b> إذا كان ${M(`${vn} ≤ ${un} ≤ w<sub>n</sub>`)} ابتداءً من رتبة معيّنة، وكانت ${M('(v<sub>n</sub>)')} و ${M('(w<sub>n</sub>)')} متقاربتين نحو نفس العدد ${M('ℓ')}، فإنّ ${M(`${LIM}${un} = ℓ`)}. وإذا كان ${M(`${un} ≥ ${vn}`)} و ${M(`${LIM}${vn} = +∞`)} فإنّ ${M(`${LIM}${un} = +∞`)}.</div>
<div class="rule"><b>متتاليتان متجاورتان:</b> إذا كانت ${M(S)} متزايدة و ${M('(v<sub>n</sub>)')} متناقصة و ${M(`${LIM}(${vn} − ${un}) = 0`)}، فإنّهما متقاربتان نحو نفس النهاية ${M('ℓ')}، ومن أجل كلّ ${M('n')}: ${M(`${un} ≤ ℓ ≤ ${vn}`)}.</div>
<div class="rule"><b>متتالية تراجعية:</b> إذا كان ${M(`${un1} = f(${un})`)} حيث ${M('f')} دالة مستمرّة، وكانت ${M(S)} متقاربة نحو ${M('ℓ')}، فإنّ ${M('ℓ')} حلّ للمعادلة ${M('f(x) = x')}.</div></div>

<div class="card"><h3>٧) طريقة المتتالية المساعدة</h3>
<p>هذه الطريقة حاضرة في أغلب مواضيع البكالوريا. نعتبر ${M(`${un1} = a${un} + b`)} حيث ${M('a ≠ 0')} و ${M('a ≠ 1')}.</p>
<ol class="steps"><li>نبحث عن العدد ${M('α')} الذي يحقّق ${M('α = aα + b')}، أي ${M(`α = ${f('b','1 − a')}`)}.</li>
<li>نضع ${M(`${vn} = ${un} − α`)}، فنجد ${M(`${vn1} = a${un} + b − (aα + b) = a(${un} − α) = a${vn}`)}: المتتالية ${M('(v<sub>n</sub>)')} هندسية أساسها ${M('a')}.</li>
<li>ومنه ${M(`${vn} = ${v0} × a<sup>n</sup>`)}، ثمّ ${M(`${un} = α + (${u0} − α) × a<sup>n</sup>`)}.</li></ol>
<div class="ex"><b>مثال (متتالية الفقرة ٣ نفسها):</b> ${M(`${u0} = 1`)} و ${M(`${un1} = ${h}${un} + 2`)}.<br>
${M(`α = ${f('2','1 − 0,5')} = 4`)}، ونضع ${M(`${vn} = ${un} − 4`)}: ${M(`${v0} = −3`)} و ${M(`${vn} = −3 × (${h})<sup>n</sup>`)}، إذن ${M(`${un} = 4 − 3 × (${h})<sup>n</sup>`)}.<br>
وبما أنّ ${M(`−1 < ${h} < 1`)} فإنّ ${M(`${LIM}${un} = 4`)}.</div></div>`,

`
<div class="card"><h3>1) Généralités : définition et modes de génération</h3>
<div class="rule"><b>Définition :</b> une suite numérique ${M(S)} associe à chaque entier naturel ${M('n')} (à partir d'un rang ${M('n<sub>0</sub>')}) un réel ${M(un)}, appelé <b>terme de rang</b> ${M('n')} ou <b>terme général</b>.</div>
<p>Il y a deux façons principales de définir une suite :</p>
<ul><li><b>De façon explicite</b> ${M(`${un} = f(n)`)} : on calcule n'importe quel terme directement. Exemple : ${M(`${un} = 2n² − 1`)}, donc ${M(`${U(3)} = 2 × 9 − 1 = 17`)}.</li>
<li><b>Par récurrence</b> ${M(`${un1} = f(${un})`)}, avec un premier terme donné : chaque terme se calcule à partir du précédent. Exemple : ${M(`${u0} = 2`)} et ${M(`${un1} = 3${un} − 1`)}, donc ${M(`${U(1)} = 5`)} puis ${M(`${U(2)} = 14`)}. Pour calculer ${M(U(10))}, il faut passer par tous les termes précédents.</li></ul>
<div class="warn"><b>Attention :</b> ${M(un1)} est le terme suivant, pas ${M(`${un} + 1`)}. Par exemple, si ${M(`${un} = n²`)}, alors ${M(`${un1} = (n + 1)² = n² + 2n + 1`)}, alors que ${M(`${un} + 1 = n² + 1`)}.</div></div>

<div class="card"><h3>2) Sens de variation — suites bornées</h3>
<div class="rule">${M(S)} est <b>strictement croissante</b> si, pour tout ${M('n')}, ${M(`${un1} > ${un}`)} ; <b>strictement décroissante</b> si ${M(`${un1} < ${un}`)} ; <b>constante</b> si ${M(`${un1} = ${un}`)}. Une suite croissante ou décroissante est dite <b>monotone</b>.</div>
<p>Trois méthodes pour étudier le sens de variation :</p>
<ol class="steps"><li>Étudier le <b>signe de la différence</b> ${M(`${un1} − ${un}`)} : c'est la méthode la plus utilisée.</li>
<li>Si tous les termes sont <b>strictement positifs</b>, comparer ${M(f(un1,un))} à ${M('1')}.</li>
<li>Si ${M(`${un} = f(n)`)}, le sens de variation de la fonction ${M('f')} sur ${M('[0 ; +∞[')} donne celui de la suite.</li></ol>
<div class="ex"><b>Exemple :</b> ${M(`${un} = n² − 4n`)}. ${M(`${un1} − ${un} = (n + 1)² − 4(n + 1) − n² + 4n = 2n − 3`)}. Cette différence est strictement positive pour ${M('n ≥ 2')} : la suite est strictement croissante à partir du rang ${M('2')}.</div>
<div class="rule">${M(S)} est <b>majorée</b> par ${M('M')} si ${M(`${un} ≤ M`)} pour tout ${M('n')}, <b>minorée</b> par ${M('m')} si ${M(`${un} ≥ m`)} pour tout ${M('n')}, et <b>bornée</b> si elle est à la fois majorée et minorée.</div>
<div class="ex"><b>Exemple :</b> ${M(`${un} = 3 − ${f('1','n + 1')}`)}. Comme ${M(`0 < ${f('1','n + 1')} ≤ 1`)}, on a ${M(`2 ≤ ${un} < 3`)} : la suite est bornée.</div></div>

<div class="card"><h3>3) Raisonnement par récurrence</h3>
<div class="rule">Pour démontrer qu'une propriété ${M('P(n)')} est vraie pour tout entier ${M('n ≥ n<sub>0</sub>')} :
<ol class="steps"><li><b>Initialisation :</b> on vérifie que ${M('P(n<sub>0</sub>)')} est vraie.</li>
<li><b>Hérédité :</b> on suppose ${M('P(n)')} vraie pour un entier ${M('n ≥ n<sub>0</sub>')} quelconque, et on démontre ${M('P(n + 1)')}.</li>
<li><b>Conclusion :</b> ${M('P(n)')} est vraie pour tout ${M('n ≥ n<sub>0</sub>')}.</li></ol></div>
<div class="ex"><b>Exemple :</b> ${M(`${u0} = 1`)} et ${M(`${un1} = ${h}${un} + 2`)}. Montrons que ${M(`0 ≤ ${un} ≤ 4`)} pour tout entier naturel ${M('n')}.<br>
• <b>Initialisation :</b> ${M(`${u0} = 1`)} et ${M('0 ≤ 1 ≤ 4')}.<br>
• <b>Hérédité :</b> supposons ${M(`0 ≤ ${un} ≤ 4`)}. On multiplie par ${M(h)}, qui est positif : ${M(`0 ≤ ${h}${un} ≤ 2`)}, puis on ajoute ${M('2')} : ${M(`2 ≤ ${un1} ≤ 4`)}, donc ${M(`0 ≤ ${un1} ≤ 4`)}.<br>
• <b>Conclusion :</b> pour tout entier naturel ${M('n')}, ${M(`0 ≤ ${un} ≤ 4`)}.</div>
<div class="warn"><b>L'hérédité seule ne suffit pas :</b> la propriété « ${M('10<sup>n</sup> + 1')} est un multiple de ${M('9')} » est héréditaire : si ${M('10<sup>n</sup> + 1 = 9k')}, alors ${M('10<sup>n+1</sup> + 1 = 9(10k − 1)')}. Pourtant elle est toujours fausse, par exemple ${M('10<sup>0</sup> + 1 = 2')}. L'initialisation est obligatoire.</div></div>

<div class="card"><h3>4) Suites arithmétiques</h3>
<div class="rule"><b>Définition :</b> ${M(S)} est arithmétique s'il existe un réel ${M('r')} tel que, pour tout ${M('n')}, ${M(`${un1} = ${un} + r`)}. Le réel ${M('r')} est la <b>raison</b> de la suite.</div>
<div class="rule"><b>Terme général :</b> ${M(`${un} = ${u0} + nr`)}, et plus généralement ${M(`${un} = ${U('p')} + (n − p)r`)}.</div>
<div class="ex"><b>Exemple :</b> ${M(`${u0} = 7`)} et ${M('r = −3')} : ${M(`${un} = 7 − 3n`)}, donc ${M(`${U(20)} = 7 − 60 = −53`)}.</div>
<p><b>Sens de variation :</b> ${M(`${un1} − ${un} = r`)}, donc la suite est strictement croissante si ${M('r > 0')}, strictement décroissante si ${M('r < 0')}, constante si ${M('r = 0')}.</p>
<div class="rule"><b>Somme de termes consécutifs :</b> ${M(`S = ${U('p')} + ${U('p+1')} + … + ${un} = (n − p + 1) × ${f(`${U('p')} + ${un}`,'2')}`)}<br>
c'est-à-dire : <b>nombre de termes × (premier terme + dernier terme) ÷ 2</b>. Cas particulier : ${M(`1 + 2 + … + n = ${f('n(n + 1)','2')}`)}.</div>
<div class="ex">${M(`1 + 2 + … + 100 = ${f('100 × 101','2')} = 5050`)}.</div>
<div class="rule"><b>Moyenne arithmétique :</b> ${M('a')}, ${M('b')}, ${M('c')} sont trois termes consécutifs d'une suite arithmétique si et seulement si ${M('2b = a + c')}.</div></div>

<div class="card"><h3>5) Suites géométriques</h3>
<div class="rule"><b>Définition :</b> ${M(S)} est géométrique s'il existe un réel ${M('q')} tel que, pour tout ${M('n')}, ${M(`${un1} = q × ${un}`)}. Le réel ${M('q')} est la <b>raison</b> de la suite.</div>
<div class="rule"><b>Terme général :</b> ${M(`${un} = ${u0} × q<sup>n</sup>`)}, et plus généralement ${M(`${un} = ${U('p')} × q<sup>n−p</sup>`)}.</div>
<div class="ex"><b>Exemple :</b> ${M(`${u0} = 5`)} et ${M('q = 2')} : ${M(`${un} = 5 × 2<sup>n</sup>`)}, donc ${M(`${U(6)} = 5 × 64 = 320`)}.</div>
<p><b>Sens de variation</b> lorsque ${M(`${u0} > 0`)} : si ${M('q > 1')} elle est strictement croissante ; si ${M('0 < q < 1')} elle est strictement décroissante ; si ${M('q = 1')} elle est constante ; si ${M('q < 0')} les signes des termes alternent et la suite n'est pas monotone. Si ${M(`${u0} < 0`)}, les deux sens s'inversent.</p>
<div class="rule"><b>Somme de termes consécutifs</b> (${M('q ≠ 1')}) : ${M(`S = ${U('p')} + … + ${un} = ${U('p')} × ${f('1 − q<sup>n−p+1</sup>','1 − q')}`)}<br>
c'est-à-dire : <b>premier terme × (1 − raison<sup>nombre de termes</sup>) ÷ (1 − raison)</b>. Cas particulier : ${M(`1 + q + … + q<sup>n</sup> = ${f('1 − q<sup>n+1</sup>','1 − q')}`)}.</div>
<div class="ex">${M(`1 + 2 + 4 + … + 2<sup>9</sup> = ${f('1 − 2<sup>10</sup>','1 − 2')} = 1023`)}.</div>
<div class="rule"><b>Moyenne géométrique :</b> trois réels non nuls ${M('a')}, ${M('b')}, ${M('c')} sont trois termes consécutifs d'une suite géométrique si et seulement si ${M('b² = ac')}.</div></div>

<div class="card"><h3>6) Limite d'une suite — convergence</h3>
<div class="rule">${M(S)} <b>converge</b> vers le réel ${M('ℓ')} si ses termes deviennent aussi proches de ${M('ℓ')} qu'on le veut à partir d'un certain rang ; on écrit ${M(`${LIM}${un} = ℓ`)}. Sinon elle <b>diverge</b> : sa limite est ${M('+∞')} ou ${M('−∞')}, ou elle n'a pas de limite.</div>
<div class="rule"><b>Limite de ${M('q<sup>n</sup>')} :</b><br>
• si ${M('q > 1')} : ${M(`${LIM}q<sup>n</sup> = +∞`)}<br>
• si ${M('q = 1')} : ${M('q<sup>n</sup> = 1')}<br>
• si ${M('−1 < q < 1')} : ${M(`${LIM}q<sup>n</sup> = 0`)}<br>
• si ${M('q ≤ −1')} : la suite ${M('(q<sup>n</sup>)')} n'a pas de limite.</div>
<div class="rule"><b>Théorème de convergence monotone :</b> toute suite <b>croissante et majorée</b> converge ; toute suite <b>décroissante et minorée</b> converge. Une suite croissante non majorée tend vers ${M('+∞')}.</div>
<div class="rule"><b>Comparaison :</b> si ${M(`${vn} ≤ ${un} ≤ w<sub>n</sub>`)} à partir d'un certain rang, et si ${M('(v<sub>n</sub>)')} et ${M('(w<sub>n</sub>)')} convergent vers le même réel ${M('ℓ')}, alors ${M(`${LIM}${un} = ℓ`)} (théorème des gendarmes). Si ${M(`${un} ≥ ${vn}`)} et ${M(`${LIM}${vn} = +∞`)}, alors ${M(`${LIM}${un} = +∞`)}.</div>
<div class="rule"><b>Suites adjacentes :</b> si ${M(S)} est croissante, ${M('(v<sub>n</sub>)')} décroissante et ${M(`${LIM}(${vn} − ${un}) = 0`)}, alors elles convergent vers la même limite ${M('ℓ')}, et pour tout ${M('n')} : ${M(`${un} ≤ ℓ ≤ ${vn}`)}.</div>
<div class="rule"><b>Suite récurrente :</b> si ${M(`${un1} = f(${un})`)} avec ${M('f')} continue, et si ${M(S)} converge vers ${M('ℓ')}, alors ${M('ℓ')} est solution de l'équation ${M('f(x) = x')}.</div></div>

<div class="card"><h3>7) La méthode de la suite auxiliaire</h3>
<p>Cette méthode apparaît dans la plupart des sujets de BAC. On considère ${M(`${un1} = a${un} + b`)} avec ${M('a ≠ 0')} et ${M('a ≠ 1')}.</p>
<ol class="steps"><li>On cherche le réel ${M('α')} tel que ${M('α = aα + b')}, c'est-à-dire ${M(`α = ${f('b','1 − a')}`)}.</li>
<li>On pose ${M(`${vn} = ${un} − α`)} et on trouve ${M(`${vn1} = a${un} + b − (aα + b) = a(${un} − α) = a${vn}`)} : la suite ${M('(v<sub>n</sub>)')} est géométrique de raison ${M('a')}.</li>
<li>Donc ${M(`${vn} = ${v0} × a<sup>n</sup>`)}, puis ${M(`${un} = α + (${u0} − α) × a<sup>n</sup>`)}.</li></ol>
<div class="ex"><b>Exemple (la suite du paragraphe 3) :</b> ${M(`${u0} = 1`)} et ${M(`${un1} = ${h}${un} + 2`)}.<br>
${M(`α = ${f('2','1 − 0,5')} = 4`)} ; on pose ${M(`${vn} = ${un} − 4`)} : ${M(`${v0} = −3`)} et ${M(`${vn} = −3 × (${h})<sup>n</sup>`)}, donc ${M(`${un} = 4 − 3 × (${h})<sup>n</sup>`)}.<br>
Comme ${M(`−1 < ${h} < 1`)}, on obtient ${M(`${LIM}${un} = 4`)}.</div></div>`),

<div class="card"><h3>L'escalier et la photocopieuse à zoom</h3>
<p>Une suite <b>arithmétique</b> est un escalier régulier : chaque marche ajoute la même hauteur ${M('r')}. Après ${M('n')} marches, tu es monté de ${M('n × r')} — d'où ${M(`${un} = ${u0} + nr`)}.</p>
<p>Une suite <b>géométrique</b> est une photocopieuse réglée sur un zoom fixe ${M('× q')} : chaque copie est la précédente agrandie (${M('q > 1')}) ou réduite (${M('0 < q < 1')}). Après ${M('n')} copies, l'original a été multiplié par ${M('q<sup>n</sup>')}.</p>
<p>Toute la différence tient en un mot : on <b>ajoute</b> (arithmétique) ou on <b>multiplie</b> (géométrique) ?</p></div>
<div class="card"><h3>La récurrence = les dominos</h3>
<p>Pour que tous les dominos tombent, il faut deux choses : faire tomber le <b>premier</b> (initialisation), et que chaque domino soit <b>assez proche</b> pour renverser le suivant (hérédité).</p>
<ul><li>Sans le premier domino, rien ne tombe, même si les dominos sont bien serrés : c'est l'exemple ${M('10<sup>n</sup> + 1')} du cours.</li>
<li>Si la chaîne est coupée quelque part, la chute s'arrête : l'hérédité doit être vraie pour <b>tout</b> ${M('n')}.</li></ul></div>
<div class="card"><h3>Croissante et majorée : monter sous un plafond</h3>
<p>Tu montes sans arrêt, mais il y a un plafond que tu ne peux pas traverser. Tu t'approches donc forcément d'une certaine hauteur : la suite converge.</p>
<p>Attention : cette hauteur n'est pas forcément le plafond lui-même. Le plafond peut être à ${M('10')} et toi t'approcher de ${M('4')}. C'est pourquoi on dit « croissante et majorée par ${M('6')}, donc convergente », sans conclure que la limite vaut ${M('6')}.</p></div>
<div class="card"><h3>Converger : la moitié du chemin restant</h3>
<p>Tu es à deux mètres d'un mur et, à chaque pas, tu parcours la <b>moitié</b> de la distance qui reste. Tu ne toucheras jamais le mur, mais la distance devient plus petite que n'importe quel nombre choisi : ${M(`d<sub>n</sub> = 2 × (${h})<sup>n</sup>`)} tend vers ${M('0')}. C'est exactement le sens de ${M(`${LIM}${un} = ℓ`)} : s'approcher autant qu'on veut, pas forcément arriver.</p></div>
<div class="card"><h3>Suites adjacentes : deux marcheurs dans un couloir</h3>
<p>L'un ne marche que vers l'est, l'autre que vers l'ouest, dans le même couloir ; aucun ne dépasse l'autre, et l'écart entre eux tend vers ${M('0')}. Ils finissent forcément au même point : c'est la limite commune ${M('ℓ')}, toujours coincée entre les deux.</p></div>
<div class="card"><h3>La suite auxiliaire : changer de niveau de référence</h3>
<p>Une tasse de café refroidit dans une pièce à ${M('20°')}. La température du café varie de façon compliquée, mais l'<b>écart</b> avec la température de la pièce est multiplié à peu près par le même nombre chaque minute : cet écart est une suite géométrique !</p>
<p>C'est ce qu'on fait avec ${M(`${vn} = ${un} − α`)} : on mesure les termes à partir du « point d'équilibre » ${M('α')} au lieu de zéro, et la structure géométrique cachée apparaît.</p></div>
<div class="card"><h3>La somme de Gauss : le pliage</h3>
<p>Pour calculer ${M('1 + 2 + … + 100')}, écris la somme deux fois, une fois dans l'ordre et une fois à l'envers, puis additionne en colonnes : chaque colonne donne ${M('101')}, et il y a ${M('100')} colonnes. Le double de la somme vaut ${M('100 × 101')}, donc la somme vaut ${M('5050')}. Voilà d'où vient « premier + dernier, divisé par 2 ».</p></div>`),

`
<div class="card"><h3>Comment traiter un exercice de suites au BAC ?</h3>
<p>La plupart des exercices portent sur une suite récurrente ${M(`${un1} = f(${un})`)}, et les questions arrivent presque toujours dans cet ordre :</p>
<ol class="steps">
<li><b>Calcule les premiers termes</b> (${M(U(1))}, ${M(U(2))}) en gardant les fractions. Ils donnent une idée du comportement (croissance ? convergence ?) et permettent de vérifier la suite.</li>
<li><b>Démontre un encadrement par récurrence</b> (comme ${M(`${un} < 6`)} ou ${M(`0 ≤ ${un} ≤ 4`)}). Dans l'hérédité : pars de l'hypothèse de récurrence et applique-lui, dans l'ordre, les mêmes opérations que la relation de récurrence.</li>
<li><b>Étudie le sens de variation :</b> calcule ${M(`${un1} − ${un}`)}, factorise, puis utilise l'encadrement pour connaître son signe.</li>
<li><b>Déduis la convergence :</b> « croissante et majorée, donc convergente » — une phrase suffit.</li>
<li><b>Suite auxiliaire :</b> pour montrer que ${M('(v<sub>n</sub>)')} est géométrique, écris ${M(vn1)}, remplace ${M(un1)} par son expression, puis factorise par la raison jusqu'à obtenir ${M(`${vn1} = q × ${vn}`)}.</li>
<li><b>Exprime ${M(vn)} puis ${M(un)} en fonction de ${M('n')}</b>, et calcule la limite grâce à celle de ${M('q<sup>n</sup>')}. Pour une somme, compte d'abord le nombre de termes.</li></ol></div>
<div class="card"><h3>Les pièges</h3>
<div class="warn"><b>Piège 1 — le nombre de termes :</b> de ${M(u0)} à ${M(un)} il y a ${M('n + 1')} termes, pas ${M('n')}. Cette seule erreur fait perdre les points de la question sur la somme.</div>
<div class="warn"><b>Piège 2 :</b> ${M(un1)} n'est pas ${M(`${un} + 1`)}, et ${M(U('2n'))} n'est pas ${M(`2${un}`)}.</div>
<div class="warn"><b>Piège 3 — montrer qu'une suite est géométrique :</b> calculer ${M(f(U(1),u0))} et ${M(f(U(2),U(1)))} ne suffit pas (cela prouve seulement qu'elle n'est <b>pas</b> géométrique s'ils diffèrent). Il faut prouver ${M(`${vn1} = q × ${vn}`)} pour tout ${M('n')}, avec ${M('q')} constant, indépendant de ${M('n')}.</div>
<div class="warn"><b>Piège 4 :</b> « croissante et majorée par ${M('6')} » signifie qu'elle converge, <b>pas</b> que sa limite vaut ${M('6')}. La limite se calcule ensuite.</div>
<div class="warn"><b>Piège 5 :</b> oublier l'initialisation, ou ne pas utiliser l'hypothèse de récurrence dans l'hérédité : ce n'est alors plus un raisonnement par récurrence.</div>
<div class="warn"><b>Piège 6 :</b> ${M('(−2)<sup>n</sup>')} n'a pas de limite, et ${M('q<sup>n</sup> → 0')} seulement si ${M('−1 < q < 1')}. N'écris pas ${M('q<sup>n</sup> → +∞')} sans avoir vérifié que ${M('q > 1')}.</div>
<div class="warn"><b>Piège 7 :</b> multiplier une inégalité par un nombre négatif change son sens — cela arrive dans l'hérédité quand ${M('a < 0')}.</div></div>`)
});

/* ============================================================================
   الباب 5 — المتتاليات: مولّد التمارين، تمرين البكالوريا، المختبر
   Chapitre 5 — Suites : générateurs d'exercices, exercice type BAC, laboratoire
   Chaque générateur renvoie {type, q, ans, sol, miss|why|missF} ; q et sol sont des objets {ar,fr}.
   ============================================================================ */
(function(){
const U=i=>`u<sub>${i}</sub>`, V=i=>`v<sub>${i}</sub>`;
const un=U('n'), un1=U('n+1'), u0=U(0), vn=V('n'), vn1=V('n+1'), v0=V(0);
const LIM='lim<sub>n→+∞</sub> ';
const S='(u<sub>n</sub>)';
const st=(k,html)=>`<div class="st">${k}) ${html}</div>`;
const N_=n=>M(String(n));
const qS=(p,d)=>d===1?ar(p):(p<0?'−'+f(-p,d):f(p,d));                       /* q = p/d */
const qP=(p,d,e)=>(d!==1||p<0?`(${qS(p,d)})`:qS(p,d))+`<sup>${e}</sup>`;      /* q^e */
const pn=v=>v<0?`(${nice(v)})`:nice(v);
const kx=k=>k===1?'':k===-1?'−':ar(k)+' × ';                                 /* k × … */
const addC=d=>d?` ${sgn(d)} ${ar(Math.abs(d))}`:'';
/* d + c·n  →  « 7 − 3n » */
const lin=(d,c)=>{ const cn=(Math.abs(c)===1?'':ar(Math.abs(c)))+'n'; return d===0?(c<0?'−':'')+cn:`${ar(d)} ${sgn(c)} ${cn}`; };
const lin1=(d,c)=>{ const cn=(Math.abs(c)===1?'':ar(Math.abs(c)))+'(n + 1)'; return d===0?(c<0?'−':'')+cn:`${ar(d)} ${sgn(c)} ${cn}`; };

  if(a!==1) miss.push([(1-X)/(1-q),B(`نسيت الضرب في الحدّ الأوّل ${M(`${u0} = ${ar(a)}`)}.`,`Tu as oublié de multiplier par le premier terme ${M(`${u0} = ${ar(a)}`)}.`)]);
  const s2=st(2,M(`S = ${u0} × ${f('1 − q<sup>N</sup>','1 − q')} = ${par(a)} × ${f(`1 − ${par(q)}<sup>${N}</sup>`,`1 − ${par(q)}`)}`));
  const s3=st(3,M(`S = ${par(a)} × ${f(ar(1-X),ar(1-q))} = ${ar(ans)}`));
  return {type:'num',ans,miss,
   q:B(`${M(S)} متتالية هندسية حدّها الأوّل ${M(`${u0} = ${ar(a)}`)} وأساسها ${M(`q = ${ar(q)}`)}. احسب ${M(`S = ${u0} + ${U(1)} + … + ${U(n)}`)}.`,
       `${M(S)} est une suite géométrique de premier terme ${M(`${u0} = ${ar(a)}`)} et de raison ${M(`q = ${ar(q)}`)}. Calcule ${M(`S = ${u0} + ${U(1)} + … + ${U(n)}`)}.`),
   sol:B(st(1,`<b>عدد الحدود:</b> ${M(`N = ${n} + 1 = ${N}`)}`)+s2+s3,
         st(1,`<b>Nombre de termes :</b> ${M(`N = ${n} + 1 = ${N}`)}`)+s2+s3)};},

/* 5 — nature d'une suite donnée explicitement (QCM) */
()=>{ const OP=[{k:'A',ar:'حسابية',fr:'arithmétique'},{k:'G',ar:'هندسية',fr:'géométrique'},{k:'N',ar:'لا حسابية ولا هندسية',fr:'ni arithmétique ni géométrique'}];
  const kind=pick(['A','G','N']); let expr,sol,why;
  if(kind==='A'){ const c=nz(-6,6), d=ri(-9,9); expr=lin(d,c);
    const s1=st(1,M(`${un1} − ${un} = ${lin1(d,c)} − (${lin(d,c)}) = ${ar(c)}`));
    sol=B(s1+st(2,`الفرق ثابت لا يتعلّق بـ ${M('n')}: المتتالية <b>حسابية</b> أساسها ${M(`r = ${ar(c)}`)} وحدّها الأوّل ${M(`${u0} = ${ar(d)}`)}.`),
          s1+st(2,`La différence est constante, elle ne dépend pas de ${M('n')} : la suite est <b>arithmétique</b> de raison ${M(`r = ${ar(c)}`)} et de premier terme ${M(`${u0} = ${ar(d)}`)}.`));
    why={G:B(`حاصل القسمة ${M(f(un1,un))} ليس ثابتا هنا. احسب الفرق ${M(`${un1} − ${un}`)}: ستجده ثابتا.`,`Le quotient ${M(f(un1,un))} n'est pas constant ici. Calcule la différence ${M(`${un1} − ${un}`)} : elle est constante.`),
         N:B(`احسب الفرق ${M(`${un1} − ${un}`)}: ستجده ثابتا يساوي ${M(ar(c))}.`,`Calcule la différence ${M(`${un1} − ${un}`)} : elle est constante, égale à ${M(ar(c))}.`)};
  } else if(kind==='G'){ const c=pick([1,2,3,5,-2,-3]), q=pick([2,3,4,5]); const cc=c===1?'':ar(c)+' × '; expr=`${cc}${q}<sup>n</sup>`;
    const s1=M(`${f(un1,un)} = ${f(`${cc}${q}<sup>n+1</sup>`,`${cc}${q}<sup>n</sup>`)} = ${q}`);
    sol=B(st(1,`كلّ الحدود غير معدومة، و ${s1}`)+st(2,`حاصل القسمة ثابت: المتتالية <b>هندسية</b> أساسها ${M(`q = ${q}`)} وحدّها الأوّل ${M(`${u0} = ${ar(c)}`)}.`),
          st(1,`Tous les termes sont non nuls, et ${s1}`)+st(2,`Le quotient est constant : la suite est <b>géométrique</b> de raison ${M(`q = ${q}`)} et de premier terme ${M(`${u0} = ${ar(c)}`)}.`));
    const t3=M(`${ar(c)} ; ${ar(c*q)} ; ${ar(c*q*q)}`);
    why={A:B(`الحدود ${t3} لا تتغيّر بنفس المقدار: الفرق ${M(`${un1} − ${un}`)} يتعلّق بـ ${M('n')}. احسب ${M(f(un1,un))}.`,`Les termes ${t3} ne varient pas de la même quantité : la différence ${M(`${un1} − ${un}`)} dépend de ${M('n')}. Calcule ${M(f(un1,un))}.`),
         N:B(`احسب ${M(f(un1,un))}: ستجده ثابتا يساوي ${N_(q)}.`,`Calcule ${M(f(un1,un))} : il est constant, égal à ${N_(q)}.`)};
  } else { const sq=Math.random()<0.5, d=ri(1,sq?5:4); expr=sq?`n² + ${d}`:`2<sup>n</sup> + ${d}`;
    const g=n=>sq?n*n+d:Math.pow(2,n)+d, a0=g(0), a1=g(1), a2=g(2);
    const t3=j=>`${M(`${u0} = ${a0}`)}${j}${M(`${U(1)} = ${a1}`)}${j}${M(`${U(2)} = ${a2}`)}`, s1=st(1,t3(' ، ')), s1f=st(1,t3(', '));
    const dA=`${M(`${U(1)} − ${u0} = ${a1-a0}`)}`, dB=`${M(`${U(2)} − ${U(1)} = ${a2-a1}`)}`;
    const rA=`${M(`${f(U(1),u0)} = ${frs(a1,a0)}`)}`, rB=`${M(`${f(U(2),U(1))} = ${frs(a2,a1)}`)}`;
    sol=B(s1+st(2,`${dA} و ${dB}: الفرق ليس ثابتا، إذن ليست حسابية.`)+st(3,`${rA} و ${rB}: حاصل القسمة ليس ثابتا، إذن ليست هندسية.`),
          s1f+st(2,`${dA} et ${dB} : la différence n'est pas constante, donc elle n'est pas arithmétique.`)+st(3,`${rA} et ${rB} : le quotient n'est pas constant, donc elle n'est pas géométrique.`));
    why={A:B(`${dA} بينما ${dB}: الفرق ليس ثابتا.`,`${dA} alors que ${dB} : la différence n'est pas constante.`),
         G:B(`${rA} بينما ${rB}: حاصل القسمة ليس ثابتا.`,`${rA} alors que ${rB} : le quotient n'est pas constant.`)};
  }
  return {type:'choice',opts:OP,ans:kind,why,sol,
   q:B(`ما طبيعة المتتالية المعرّفة على ${M('ℕ')} بـ ${M(`${un} = ${expr}`)}؟`,`Quelle est la nature de la suite définie sur ${M('ℕ')} par ${M(`${un} = ${expr}`)} ?`)};},

/* 6 — sens de variation (QCM) */
()=>{ const OP=[{k:'C',ar:'متزايدة تماما',fr:'strictement croissante'},{k:'D',ar:'متناقصة تماما',fr:'strictement décroissante'},{k:'X',ar:'ليست رتيبة',fr:'ni croissante ni décroissante'}];
  const v=pick(['lin','geo','geo','quad']); let expr,ans,sol;
  const pos=B('موجب','positive'), neg=B('سالب','négative');
  if(v==='lin'){ const c=nz(-6,6), d=ri(-9,9); expr=lin(d,c); ans=c>0?'C':'D';
    const s1=st(1,M(`${un1} − ${un} = ${ar(c)}`));
    sol=B(s1+st(2,`الفرق ${c>0?'موجب':'سالب'} تماما، إذن المتتالية ${c>0?'متزايدة':'متناقصة'} تماما (حسابية أساسها ${M(ar(c))}).`),
          s1+st(2,`La différence est strictement ${c>0?'positive':'négative'} : la suite est strictement ${c>0?'croissante':'décroissante'} (arithmétique de raison ${M(ar(c))}).`));
  } else if(v==='geo'){ const k=pick([1,2,3,4,-1,-2,-3]), [qp,qd]=pick([[2,1],[3,1],[1,2],[1,3],[2,3],[-2,1],[-1,2]]), q=qp/qd;
    expr=kx(k)+qP(qp,qd,'n');
    if(q<0){ ans='X'; const t0=k, t1=k*q, t2=k*q*q;
      const t3=j=>`${M(`${u0} = ${nice(t0)}`)}${j}${M(`${U(1)} = ${nice(t1)}`)}${j}${M(`${U(2)} = ${nice(t2)}`)}`, tt=t3(' ، '), ttf=t3(', ');
      const cmp=`${M(`${U(1)} ${t1<t0?'<':'>'} ${u0}`)}`, cmp2=`${M(`${U(2)} ${t2<t1?'<':'>'} ${U(1)}`)}`;
      sol=B(st(1,`الأساس ${M(`q = ${qS(qp,qd)}`)} سالب، فإشارات الحدود تتناوب: ${tt}.`)+st(2,`${cmp} لكنّ ${cmp2}: المتتالية ليست رتيبة.`),
            st(1,`La raison ${M(`q = ${qS(qp,qd)}`)} est négative, donc les signes des termes alternent : ${ttf}.`)+st(2,`${cmp} mais ${cmp2} : la suite n'est pas monotone.`));
    } else { const s=Math.sign(k)*Math.sign(q-1); ans=s>0?'C':'D';
      const s1=st(1,M(`${un1} − ${un} = ${kx(k)}${qP(qp,qd,'n')} × (${qS(qp,qd)} − 1) = ${kx(k)}${qP(qp,qd,'n')} × ${pn(q-1)}`));
      sol=B(s1+st(2,`${M(qP(qp,qd,'n')+' > 0')}، و ${M(ar(k))} ${k>0?'موجب':'سالب'}، و ${M(`${qS(qp,qd)} − 1`)} ${q>1?'موجب':'سالب'}: الفرق ${s>0?'موجب':'سالب'} تماما، إذن المتتالية ${s>0?'متزايدة':'متناقصة'} تماما.`),
            s1+st(2,`${M(qP(qp,qd,'n')+' > 0')}, ${M(ar(k))} est ${k>0?'positif':'négatif'} et ${M(`${qS(qp,qd)} − 1`)} est ${q>1?'positif':'négatif'} : la différence est strictement ${s>0?'positive':'négative'}, donc la suite est strictement ${s>0?'croissante':'décroissante'}.`));
    }
  } else { const kind=pick(['up','mix','down']), d=ri(-5,5);
    if(kind==='mix'){ const c=ri(3,7); expr=`n² − ${c}n${addC(d)}`; ans='X';
      const s1=st(1,M(`${un1} − ${un} = 2n + 1 − ${c} = 2n − ${c-1}`));
      const e=`${M(`${U(1)} − ${u0} = ${1-c} < 0`)}`, e2=`${M(`${U(c+1)} − ${U(c)} = ${c+1} > 0`)}`;
      sol=B(s1+st(2,`${e} لكنّ ${e2}: الفرق يغيّر إشارته، فالمتتالية ليست رتيبة (تتناقص ثمّ تتزايد).`),
            s1+st(2,`${e} mais ${e2} : la différence change de signe, la suite n'est donc pas monotone (elle décroît puis croît).`));
    } else { const c=ri(0,4), up=kind==='up', cn=c?` ${up?'+':'−'} ${c===1?'':c}n`:'';
      expr=`${up?'':'−'}n²${cn}${addC(d)}`; ans=up?'C':'D';
      const df=up?`2n + ${1+c}`:`−2n − ${1+c}`;
      const s1=st(1,M(`${un1} − ${un} = ${df}`));
      sol=B(s1+st(2,`من أجل كلّ ${M('n ≥ 0')}: ${M(`${df} ${up?'>':'<'} 0`)}، إذن المتتالية ${up?'متزايدة':'متناقصة'} تماما.`),
            s1+st(2,`Pour tout ${M('n ≥ 0')} : ${M(`${df} ${up?'>':'<'} 0`)}, donc la suite est strictement ${up?'croissante':'décroissante'}.`));
    }
  }
  const W={C:B(`الفرق ${M(`${un1} − ${un}`)} موجب تماما من أجل كلّ ${M('n')}: كلّ حدّ أكبر من الذي قبله.`,`La différence ${M(`${un1} − ${un}`)} est strictement positive pour tout ${M('n')} : chaque terme est plus grand que le précédent.`),
           D:B(`الفرق ${M(`${un1} − ${un}`)} سالب تماما من أجل كلّ ${M('n')}: كلّ حدّ أصغر من الذي قبله.`,`La différence ${M(`${un1} − ${un}`)} est strictement négative pour tout ${M('n')} : chaque terme est plus petit que le précédent.`),
           X:B(`احسب أوّل الحدود: المتتالية تنقص في موضع وتزيد في آخر، فهي ليست رتيبة.`,`Calcule les premiers termes : la suite diminue à un endroit et augmente à un autre, elle n'est donc pas monotone.`)};
  const why={}; OP.forEach(o=>{ if(o.k!==ans) why[o.k]=W[ans]; });
  return {type:'choice',opts:OP,ans,why,sol,
   q:B(`ما اتجاه تغيّر المتتالية المعرّفة على ${M('ℕ')} بـ ${M(`${un} = ${expr}`)}؟`,`Quel est le sens de variation de la suite définie sur ${M('ℕ')} par ${M(`${un} = ${expr}`)} ?`)};},

/* 7 — limite de c·qⁿ + d (QCM) */
()=>{ const cat=pick(['s','s','s','b','b','g']);
  const Q={s:[[1,2],[1,3],[2,3],[3,4],[-1,2],[-1,3]], b:[[2,1],[3,1],[3,2],[5,4]], g:[[-2,1],[-3,1],[-1,1]]};
  const [qp,qd]=pick(Q[cat]), c=nz(-5,5), d=ri(-6,6), qs=qS(qp,qd);
  const expr=kx(c)+qP(qp,qd,'n')+addC(d);
  const ans=cat==='s'?'L':cat==='b'?(c>0?'P':'M'):'N';
  const opts=[{k:'L',ar:M(ar(d)),fr:M(ar(d))}].concat(d!==0?[{k:'Z',ar:M('0'),fr:M('0')}]:[],
    [{k:'P',ar:M('+∞'),fr:M('+∞')},{k:'M',ar:M('−∞'),fr:M('−∞')},{k:'N',ar:'ليست لها نهاية',fr:'pas de limite'}]);
  let sol;
  if(cat==='s'){
    sol=B(st(1,`${M(`−1 < ${qs} < 1`)}، إذن ${M(`${LIM}${qP(qp,qd,'n')} = 0`)}، ومنه ${M(`${LIM}${kx(c)}${qP(qp,qd,'n')} = 0`)}.`)+st(2,`${M(`${LIM}${un} = 0${addC(d)} = ${ar(d)}`)}.`),
          st(1,`${M(`−1 < ${qs} < 1`)}, donc ${M(`${LIM}${qP(qp,qd,'n')} = 0`)}, d'où ${M(`${LIM}${kx(c)}${qP(qp,qd,'n')} = 0`)}.`)+st(2,`${M(`${LIM}${un} = 0${addC(d)} = ${ar(d)}`)}.`));
  } else if(cat==='b'){ const inf=c>0?'+∞':'−∞';
    sol=B(st(1,`${M(`${qs} > 1`)}، إذن ${M(`${LIM}${qP(qp,qd,'n')} = +∞`)}.`)+st(2,`${M(`${ar(c)} ${c>0?'> 0':'< 0'}`)}، إذن ${M(`${LIM}${kx(c)}${qP(qp,qd,'n')} = ${inf}`)}، وإضافة ${M(ar(d))} لا تغيّر شيئا: ${M(`${LIM}${un} = ${inf}`)}.`),
          st(1,`${M(`${qs} > 1`)}, donc ${M(`${LIM}${qP(qp,qd,'n')} = +∞`)}.`)+st(2,`${M(`${ar(c)} ${c>0?'> 0':'< 0'}`)}, donc ${M(`${LIM}${kx(c)}${qP(qp,qd,'n')} = ${inf}`)}, et ajouter ${M(ar(d))} ne change rien : ${M(`${LIM}${un} = ${inf}`)}.`));
  } else {
    sol=B(st(1,`${M(`${qs} ≤ −1`)}: إشارة ${M(qP(qp,qd,'n'))} تتغيّر من رتبة إلى أخرى ولا تقترب من أيّ عدد، فـ ${M(`(${qP(qp,qd,'n')})`)} ليست لها نهاية.`)+st(2,`إذن ${M(S)} ليست لها نهاية.`),
          st(1,`${M(`${qs} ≤ −1`)} : le signe de ${M(qP(qp,qd,'n'))} change d'un rang à l'autre et ne s'approche d'aucun nombre, donc ${M(`(${qP(qp,qd,'n')})`)} n'a pas de limite.`)+st(2,`Donc ${M(S)} n'a pas de limite.`));
  }
  const why={};
  const msg={
    toZ:B(`${M(`${kx(c)}${qP(qp,qd,'n')}`)} يؤول إلى ${M('0')}، لكن يبقى الحدّ الثابت: ${M(`${un} → ${ar(d)}`)}.`,`${M(`${kx(c)}${qP(qp,qd,'n')}`)} tend vers ${M('0')}, mais il reste le terme constant : ${M(`${un} → ${ar(d)}`)}.`),
    small:B(`${M(`−1 < ${qs} < 1`)}: قوى عدد محصور بين ${M('−1')} و ${M('1')} تصغر وتؤول إلى ${M('0')}.`,`${M(`−1 < ${qs} < 1`)} : les puissances d'un nombre compris entre ${M('−1')} et ${M('1')} rapetissent et tendent vers ${M('0')}.`),
    big:B(`${M(`${qs} > 1`)}: ${M(qP(qp,qd,'n'))} يؤول إلى ${M('+∞')}، فالمتتالية لا تستقرّ عند عدد.`,`${M(`${qs} > 1`)} : ${M(qP(qp,qd,'n'))} tend vers ${M('+∞')}, la suite ne se stabilise pas.`),
    sign:B(`انتبه إلى إشارة المعامل ${M(ar(c))}: ${M(`${ar(c)} × (+∞) = ${c>0?'+∞':'−∞'}`)}.`,`Attention au signe du coefficient ${M(ar(c))} : ${M(`${ar(c)} × (+∞) = ${c>0?'+∞':'−∞'}`)}.`),
    hasLim:B(`للمتتالية نهاية هنا: ${M(`q = ${qs}`)} أكبر من ${M('−1')}.`,`La suite a bien une limite ici : ${M(`q = ${qs}`)} est supérieur à ${M('−1')}.`),
    none:B(`${M(`${qs} ≤ −1`)}: الحدود تتناوب في الإشارة دون أن تقترب من عدد: لا توجد نهاية.`,`${M(`${qs} ≤ −1`)} : les termes alternent de signe sans s'approcher d'un nombre : pas de limite.`)};
  opts.forEach(o=>{ if(o.k===ans) return;
    why[o.k]= ans==='N'?msg.none
      : ans==='L'?(o.k==='Z'?msg.toZ:o.k==='N'?msg.hasLim:msg.small)
      : (o.k==='P'||o.k==='M')?msg.sign : o.k==='N'?msg.hasLim : msg.big; });
  return {type:'choice',opts,ans,why,sol,
   q:B(`ما نهاية المتتالية ${M(`${un} = ${expr}`)} عندما يؤول ${M('n')} إلى ${M('+∞')}؟`,`Quelle est la limite de la suite ${M(`${un} = ${expr}`)} quand ${M('n')} tend vers ${M('+∞')} ?`)};},

/* 8 — calcul de termes d'une suite récurrente */
()=>{ const a=ri(-4,4), k=pick([2,3,-2,-1]), b=nz(-5,5), m=pick([2,3]);
  const T=[a], W=[a]; for(let i=0;i<m;i++){ T.push(k*T[i]+b); W.push(k*(W[i]+b)); }
  const rec=`${cx(k)}${un}${addC(b)}`;
  let steps=''; for(let i=0;i<m;i++) steps+=st(i+1,M(`${U(i+1)} = ${ar(k)} × ${par(T[i])}${addC(b)} = ${ar(T[i+1])}`));
  return {type:'num',ans:T[m],
   q:B(`${M(S)} متتالية معرّفة بـ ${M(`${u0} = ${ar(a)}`)} ومن أجل كلّ عدد طبيعي ${M('n')}: ${M(`${un1} = ${rec}`)}. احسب ${M(U(m))}.`,
       `${M(S)} est définie par ${M(`${u0} = ${ar(a)}`)} et, pour tout entier naturel ${M('n')}, ${M(`${un1} = ${rec}`)}. Calcule ${M(U(m))}.`),
   miss:[[T[m-1],B(`هذا هو ${M(U(m-1))}: تحتاج خطوة أخرى للوصول إلى ${M(U(m))}.`,`C'est ${M(U(m-1))} : il faut encore une étape pour arriver à ${M(U(m))}.`)],
         [W[m],B(`الضرب قبل الجمع: ${M(rec)} تعني ${M(`(${ar(k)} × ${un})${addC(b)}`)}، وليس ${M(`${ar(k)} × (${un}${addC(b)})`)}.`,`La multiplication passe avant l'addition : ${M(rec)} signifie ${M(`(${ar(k)} × ${un})${addC(b)}`)}, et non ${M(`${ar(k)} × (${un}${addC(b)})`)}.`)],
         [k*T[m]+b,B(`ذهبت خطوة أبعد: هذا هو ${M(U(m+1))}.`,`Tu es allé(e) une étape trop loin : c'est ${M(U(m+1))}.`)]],
   sol:B(steps,steps)};},

/* 9 — suite auxiliaire : α, raison de (vₙ), limite */
()=>{ const [p,d]=pick([[1,2],[1,3],[2,3],[3,4],[-1,2],[2,1],[3,1]]), a=p/d, t=nz(-3,3);
  const alpha=d===1?t:d*t, b=d===1?t*(1-p):t*(d-p);
  const aS=qS(p,d), rec=`${un1} = ${d===1?cx(p):aS}${un}${addC(b)}`;
  const vdef=`${vn} = ${un}${addC(-alpha)}`;
  const variant=Math.abs(a)<1?pick(['alpha','ratio','lim']):pick(['alpha','ratio']);
  const aMinus=`1 − ${a<0?'('+aS+')':aS}`;
  const aC=d===1?cx(p):aS, aAl=a<0?` − ${qS(-p,d)}α`:` + ${aC}α`;          /* « + aα » avec le bon signe */
  const s1=st(1,M(`${vn1} = ${un1} − α = ${aC}${un}${addC(b)} − α = ${aC}(${un} − α)${aAl}${addC(b)} − α`));
  if(variant==='alpha'){
    const s2=B(st(2,`نريد ${M(`${vn1} = ${aS} × ${vn}`)}، أي ${M(`${aS}α${addC(b)} − α = 0`)}، ومنه ${M(`α = ${f(ar(b),aMinus)} = ${ar(alpha)}`)}.`),
               st(2,`On veut ${M(`${vn1} = ${aS} × ${vn}`)}, c'est-à-dire ${M(`${aS}α${addC(b)} − α = 0`)}, d'où ${M(`α = ${f(ar(b),aMinus)} = ${ar(alpha)}`)}.`));
    return {type:'num',ans:alpha,
     q:B(`${M(S)} معرّفة بـ ${M(rec)}. نضع ${M(`${vn} = ${un} − α`)}. عيّن العدد الحقيقي ${M('α')} الذي تكون من أجله ${M('(v<sub>n</sub>)')} متتالية هندسية.`,

    if(b===0) return B(`المتتالية ثابتة: كلّ حدودها تساوي ${M(ar(x0))}.`,`La suite est constante : tous ses termes valent ${M(ar(x0))}.`);
    return b>0?B(`${M('r > 0')}: المتتالية متزايدة تماما و ${M(`${LIM}${un} = +∞`)}.`,`${M('r > 0')} : la suite est strictement croissante et ${M(`${LIM}${un} = +∞`)}.`)
              :B(`${M('r < 0')}: المتتالية متناقصة تماما و ${M(`${LIM}${un} = −∞`)}.`,`${M('r < 0')} : la suite est strictement décroissante et ${M(`${LIM}${un} = −∞`)}.`);
  }
  const al=b/(1-a), AL=ar(rnd(al,3));
  if(Math.abs(x0-al)<1e-9) return B(`${M(`${u0} = α`)}: المتتالية ثابتة، كلّ حدودها تساوي ${M(AL)}.`,`${M(`${u0} = α`)} : la suite est constante, tous ses termes valent ${M(AL)}.`);
  if(Math.abs(a)<1) return B(`${M('−1 < a < 1')}: ${M('a<sup>n</sup> → 0')}، إذن المتتالية متقاربة و ${M(`${LIM}${un} = α = ${AL}`)}.`,`${M('−1 < a < 1')} : ${M('a<sup>n</sup> → 0')}, donc la suite converge et ${M(`${LIM}${un} = α = ${AL}`)}.`);
  if(a>1){ const s=x0>al?'+∞':'−∞';
    return B(`${M('a > 1')} و ${M(`${u0} ${x0>al?'>':'<'} α`)}: ${M(`${LIM}${un} = ${s}`)}.`,`${M('a > 1')} et ${M(`${u0} ${x0>al?'>':'<'} α`)} : ${M(`${LIM}${un} = ${s}`)}.`); }
  return a===-1?B(`${M('a = −1')}: الحدود تتناوب بين قيمتين حول ${M('α')}: المتتالية ليست لها نهاية.`,`${M('a = −1')} : les termes alternent entre deux valeurs autour de ${M('α')} : la suite n'a pas de limite.`)
               :B(`${M('a < −1')}: الحدود تتناوب حول ${M('α')} وتبتعد عنه: المتتالية ليست لها نهاية.`,`${M('a < −1')} : les termes alternent autour de ${M('α')} en s'en éloignant : la suite n'a pas de limite.`);
}

function draw(){
  const svg=document.getElementById('lsvg'); if(!svg) return;
  const {a,b,u0:x0,mode}=LS, K=Math.min(LS.k,KMAX), T=terms(KMAX);
  const alpha=a!==1?b/(1-a):null;
  const C='#0F5C4E', G='#B8860B', GR='#9AA3AE', TX='#5B6676';
  let h='';
  const txt=(x,y,s,anc,sz,col)=>`<text x="${x}" y="${y}" font-size="${sz||11}" text-anchor="${anc||'middle'}" fill="${col||TX}">${s}</text>`;
  if(mode==='pts'){
    const vals=T.filter(fin).map(v=>Math.max(-CLV,Math.min(CLV,v))).concat([0]);
    if(alpha!==null&&Math.abs(a)<1) vals.push(alpha);
    let lo=Math.min(...vals), hi=Math.max(...vals); if(hi-lo<2){ const m=(hi+lo)/2; lo=m-1; hi=m+1; }
    const pad=(hi-lo)*0.08, L0=lo, H0=hi; lo-=pad; hi+=pad;
    const X0=40,X1=348,Y0=12,Y1=268, sx=n=>X0+n*(X1-X0)/KMAX, sy=v=>Y1-(v-lo)*(Y1-Y0)/(hi-lo);
    h+=`<rect x="${X0}" y="${Y0}" width="${X1-X0}" height="${Y1-Y0}" fill="none" stroke="#E2DDD2"/>`;
    if(lo<0&&hi>0) h+=`<line x1="${X0}" y1="${sy(0)}" x2="${X1}" y2="${sy(0)}" stroke="${GR}"/>`+txt(X0-5,sy(0)+4,'0','end',10.5);
    for(let n=0;n<=KMAX;n+=2) h+=txt(sx(n),Y1+16,n);
    h+=txt(X1,Y1+28,'n','end',11)+txt(X0-5,sy(H0)+4,ar(rnd(H0,1)),'end',10.5)+txt(X0-5,sy(L0)+4,ar(rnd(L0,1)),'end',10.5);
    if(alpha!==null&&alpha>lo&&alpha<hi) h+=`<line x1="${X0}" y1="${sy(alpha)}" x2="${X1}" y2="${sy(alpha)}" stroke="${G}" stroke-dasharray="5 4"/>`+txt(X1-4,sy(alpha)-5,'α','end',13,G);
    for(let n=0;n<=K;n++){ const v=T[n]; if(!fin(v)&&!isFinite(v)) continue;
      const cv=Math.max(lo,Math.min(hi,v)), out=cv!==v;
      h+=`<circle cx="${sx(n)}" cy="${sy(cv)}" r="${out?3:4.3}" fill="${out?'#A62B39':C}"/>`; }
  } else {
    const vals=[x0,0]; for(let i=0;i<=K;i++) if(fin(T[i])) vals.push(Math.max(-CLV,Math.min(CLV,T[i])));
    if(alpha!==null&&fin(alpha)&&Math.abs(alpha)<=CLV) vals.push(alpha);
    let lo=Math.min(...vals), hi=Math.max(...vals); if(hi-lo<4){ const m=(hi+lo)/2; lo=m-2; hi=m+2; }
    const pad=(hi-lo)*0.1; lo-=pad; hi+=pad; const W=hi-lo;
    const X0=30,X1=350,Y0=10,Y1=270;
    const cl=v=>Math.max(lo-W,Math.min(hi+W,v));
    const sx=v=>X0+(cl(v)-lo)*(X1-X0)/W, sy=v=>Y1-(cl(v)-lo)*(Y1-Y0)/W;
    h+=`<defs><clipPath id="lclip"><rect x="${X0}" y="${Y0}" width="${X1-X0}" height="${Y1-Y0}"/></clipPath></defs>`;
    h+=`<rect x="${X0}" y="${Y0}" width="${X1-X0}" height="${Y1-Y0}" fill="none" stroke="#E2DDD2"/>`;
    const base=(lo<0&&hi>0)?0:lo;
    h+='<g clip-path="url(#lclip)">';
    if(lo<0&&hi>0) h+=`<line x1="${X0}" y1="${sy(0)}" x2="${X1}" y2="${sy(0)}" stroke="${GR}"/><line x1="${sx(0)}" y1="${Y0}" x2="${sx(0)}" y2="${Y1}" stroke="${GR}"/>`;
    h+=`<line x1="${sx(lo)}" y1="${sy(lo)}" x2="${sx(hi)}" y2="${sy(hi)}" stroke="${GR}" stroke-dasharray="6 4" stroke-width="1.4"/>`;
    h+=`<line x1="${sx(lo)}" y1="${sy(a*lo+b)}" x2="${sx(hi)}" y2="${sy(a*hi+b)}" stroke="${C}" stroke-width="2.2"/>`;
    if(K>0){ let d=`M${sx(x0)} ${sy(base)}`;
      for(let i=0;i<K;i++){ if(!fin(T[i+1])) break; d+=` L${sx(T[i])} ${sy(T[i+1])} L${sx(T[i+1])} ${sy(T[i+1])}`; }
      h+=`<path d="${d}" fill="none" stroke="${G}" stroke-width="1.8" stroke-linejoin="round"/>`; }
    if(alpha!==null&&fin(alpha)) h+=`<circle cx="${sx(alpha)}" cy="${sy(alpha)}" r="4.5" fill="${G}"/>`;
    const lab=[];
    for(let i=0;i<=Math.min(K,3);i++){ if(!fin(T[i])||T[i]<lo||T[i]>hi) continue;
      h+=`<circle cx="${sx(T[i])}" cy="${sy(base)}" r="3" fill="${C}"/>`;
      let ly=sy(base)+15+(i%2)*11; if(ly>Y1-3) ly=sy(base)-7-(i%2)*11;      /* au-dessus de l'axe s'il est trop bas */
      lab.push(`<text x="${sx(T[i])}" y="${ly}" font-size="11" text-anchor="middle" fill="${C}">u<tspan font-size="8.5" dy="3">${i}</tspan></text>`); }
    h+='</g>'+lab.join('');
    /* légende sous le cadre */
    h+=`<line x1="${X0}" y1="285" x2="${X0+22}" y2="285" stroke="${GR}" stroke-dasharray="6 4" stroke-width="1.4"/>`+txt(X0+28,289,'y = x','start',11,GR)
      +`<line x1="${X0+92}" y1="285" x2="${X0+114}" y2="285" stroke="${C}" stroke-width="2.2"/>`+txt(X0+120,289,'y = ax + b','start',11,C);
    if(alpha!==null&&fin(alpha)&&alpha>lo&&alpha<hi) h+=txt(sx(alpha)+8,sy(alpha)-7,'α','start',13,G);
  }
  svg.innerHTML=h;
  const el=document.getElementById('lread'); if(!el) return;
  const T6=terms(6), fm=v=>fin(v)&&Math.abs(v)<1e6?ar(rnd(v,3)):'…';
  el.innerHTML=fix(`<p>${T6.map((v,i)=>M(`${U(i)} = ${fm(v)}`)).join(LANG==='ar'?' ؛ ':' ; ')}</p><p class="obs">${tr(natureTxt())}</p><p class="obs">${tr(limTxt())}</p>`);
}
function playLabel(){ const b=document.getElementById('lplay'); if(b) b.textContent=LS.tm?'■ '+tr(B('إيقاف','Arrêter')):'▶ '+tr(B('شغّل الحركة','Animer')); }
function stopAnim(){ if(LS.tm){ clearInterval(LS.tm); LS.tm=null; } }

LABS[5]=function(p){
  stopAnim(); LS.k=KMAX;
  const sl=(id,lab,min,max,step,val)=>`<label class="sl"><span><span class="m">${lab} = <b class="lat" id="v${id}">${ar(val)}</b></span></span><input type="range" id="s${id}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`;
  const modes=[['web',B('السلّم (التمثيل البياني)','Escalier (représentation graphique)')],['pts',B('سحابة النقط','Nuage de points')]];
  p.innerHTML=fix(`<div class="lab">
   <div class="labhead"><b>${tr(B('مختبر المتتاليات','Laboratoire des suites'))} — ${M(`${un1} = a${un} + b`)}</b><span class="labtip">${tr(B('حرّك المؤشّرات وشاهد الحدود تتغيّر','Déplace les curseurs et observe les termes'))}</span></div>
   <div class="btnrow labmodes">${modes.map(([k,t])=>`<button class="btn small ${LS.mode===k?'':'sec2'}" data-lm="${k}">${tr(t)}</button>`).join('')}</div>
   <div class="labctl">${sl('a','a',-1.5,1.5,0.1,LS.a)}${sl('b','b',-4,4,0.5,LS.b)}${sl('u','u<sub>0</sub>',-6,6,0.5,LS.u0)}</div>
   <div class="btnrow" style="margin:2px 0 8px">${PRE.map((x,i)=>`<button class="btn small sec2" data-pre="${i}">${tr(x[0])}</button>`).join('')}</div>
   <svg class="labsvg" id="lsvg" viewBox="0 0 360 300" style="direction:ltr" role="img" aria-label="${tr(B('تمثيل حدود المتتالية','Représentation des termes de la suite'))}"></svg>
   <div class="btnrow"><button class="btn small" id="lplay"></button><button class="btn small sec2" id="lstep">+1 ${tr(B('خطوة','étape'))}</button></div>
   <div class="labread" id="lread"></div>
   <div class="labnote">${tr(B(
    `<b>لاحظ:</b> المستقيمان ${M('y = ax + b')} و ${M('y = x')} يتقاطعان في النقطة التي فاصلتها ${M('α')}. إذا كان ${M('−1 < a < 1')} فإنّ «السلّم» ينجذب نحو هذه النقطة (متتالية متقاربة)، وإذا كان ${M('a < 0')} يصبح السلّم حلزونا لأنّ الحدود تتناوب حول ${M('α')}. جرّب ${M('a = 1')} (حسابية: المستقيمان متوازيان)، ثمّ ${M('b = 0')} (هندسية).`,
    `<b>Observe :</b> les droites ${M('y = ax + b')} et ${M('y = x')} se coupent au point d'abscisse ${M('α')}. Si ${M('−1 < a < 1')}, l'« escalier » est attiré par ce point (suite convergente) ; si ${M('a < 0')}, il devient une spirale car les termes alternent autour de ${M('α')}. Essaie ${M('a = 1')} (arithmétique : les droites sont parallèles), puis ${M('b = 0')} (géométrique).`))}</div></div>`);
  const sync=()=>{ [['a','a'],['b','b'],['u','u0']].forEach(([id,k])=>{ const s=p.querySelector('#s'+id), v=p.querySelector('#v'+id); if(s) s.value=LS[k]; if(v) v.textContent=ar(LS[k]); }); };
  [['a','a'],['b','b'],['u','u0']].forEach(([id,k])=>{ const s=p.querySelector('#s'+id);
    s.oninput=()=>{ LS[k]=r1(+s.value); p.querySelector('#v'+id).textContent=ar(LS[k]); stopAnim(); LS.k=KMAX; playLabel(); draw(); }; });
  p.querySelectorAll('[data-pre]').forEach(bt=>bt.onclick=()=>{ const x=PRE[+bt.dataset.pre]; LS.a=x[1]; LS.b=x[2]; LS.u0=x[3]; sync(); stopAnim(); LS.k=KMAX; playLabel(); draw(); });
  p.querySelectorAll('[data-lm]').forEach(bt=>bt.onclick=()=>{ LS.mode=bt.dataset.lm; LABS[5](p); });
  p.querySelector('#lplay').onclick=()=>{
    if(LS.tm){ stopAnim(); LS.k=KMAX; playLabel(); draw(); return; }
    LS.k=0; draw(); LS.tm=setInterval(()=>{ if(!document.getElementById('lsvg')){ stopAnim(); return; }
      LS.k++; draw(); if(LS.k>=KMAX){ stopAnim(); playLabel(); } },650); playLabel(); };
  p.querySelector('#lstep').onclick=()=>{ stopAnim(); LS.k=LS.k>=KMAX?1:LS.k+1; playLabel(); draw(); };
  playLabel(); draw();
};
})();

/* ============================================================================
   الحفظ المحلّي: التقدّم، كرّاسة الأخطاء (مراجعة متباعدة)، الأيام، الشارات، الإعدادات
   Enregistrement local : progression, carnet d'erreurs, jours, badges, réglages.
   كلّ قراءة أو كتابة محميّة: إن رفض المتصفّح الحفظ يعمل التطبيق عاديا في الذاكرة فقط.
   ============================================================================ */
const Store=(function(){
  const KEY='mathbac.v1', GAPS=[1,3,7];           /* الفواصل: يوم، ثلاثة أيام، أسبوع */
  const blank=()=>({v:1,les:{},q:[],mast:0,days:[],badges:{},bac:{},set:{theme:'auto',z:1,rate:0.9,lang:'ar'}});
  let P=blank(), persist=true;
  try{
    const t=localStorage.getItem(KEY);
    if(t){ const o=JSON.parse(t); if(o&&o.v===1) P=merge(blank(),o); }
  }catch(e){ persist=false; }
  function merge(b,o){ for(const k in b) if(o[k]!==undefined) b[k]=(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k]))?Object.assign(b[k],o[k]):o[k]; return b; }
  function save(){ if(!persist) return false; try{ localStorage.setItem(KEY,JSON.stringify(P)); return true; }catch(e){ persist=false; return false; } }
  const pad=n=>String(n).padStart(2,'0');
  const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  function today(){ return fmt(new Date()); }
  function addDays(s,n){ const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return fmt(d); }
  function les(id){ return P.les[id]||(P.les[id]={ok:0,ko:0,h:[]}); }
  function markDay(){ const t=today(); if(!P.days.includes(t)){ P.days.push(t); P.days=P.days.slice(-120); } }
  function streak(){
    const set=new Set(P.days); let d=today(), n=0;
    if(!set.has(d)) d=addDays(d,-1);
    while(set.has(d)){ n++; d=addDays(d,-1); }
    return n;
  }
  function stars(id){
    const s=P.les[id]; if(!s) return 0;
    const acc=s.h.length?s.h.reduce((a,b)=>a+b,0)/s.h.length:0;
    return (s.ok>=30&&acc>=0.8)?3:s.ok>=15?2:s.ok>=5?1:0;
  }
  /* تسجيل نتيجة تمرين مولَّد */
  function record(lid,gi,success,run){
    const s=les(lid); success?s.ok++:s.ko++; s.h.push(success?1:0); if(s.h.length>10) s.h.shift();
    markDay();
    const t=today();
    if(run&&run.mode==='review'&&run.item){
      const it=P.q.find(x=>x.lid===run.item.lid&&x.gi===run.item.gi);
      if(it){
        if(success){ it.st++; if(it.st>=GAPS.length){ P.q=P.q.filter(x=>x!==it); P.mast++; } else it.due=addDays(t,GAPS[it.st]); }
        else { it.st=0; it.due=addDays(t,GAPS[0]); }
      }
    } else if(!success){
      const it=P.q.find(x=>x.lid===lid&&x.gi===gi);
      if(it){ it.st=0; it.due=addDays(t,GAPS[0]); }
      else { P.q.push({lid,gi,st:0,due:addDays(t,GAPS[0]),a:t}); if(P.q.length>80) P.q.shift(); }
    }
    const fresh=checkBadges(); save(); return fresh;
  }
  function due(){ const t=today(); return P.q.filter(x=>x.due<=t).sort((a,b)=>a.due<b.due?-1:1); }
  function upcoming(){ const t=today(); return P.q.filter(x=>x.due>t).sort((a,b)=>a.due<b.due?-1:1); }
  /* الشارات / badges */
  const BADGES=[
    ...L.filter(l=>!l.soon).map(l=>({id:'L'+l.id,ico:'★',t:B('متمكّن: '+l.t.ar,'Maîtrise : '+l.t.fr),d:B('ثلاث نجوم في الباب '+l.id,'Trois étoiles au chapitre '+l.id),test:()=>stars(l.id)>=3})),
    {id:'F1',ico:'✎',t:B('الانطلاقة','Premier pas'),d:B('أوّل إجابة صحيحة في مولّد التمارين','Première bonne réponse au générateur'),test:()=>Object.values(P.les).some(s=>s.ok>=1)},
    {id:'S3',ico:'◆',t:B('ثلاثة أيام متتالية','Trois jours d\'affilée'),d:B('تدرّبت ثلاثة أيام دون انقطاع','Tu t\'es entraîné(e) trois jours sans interruption'),test:()=>streak()>=3},
    {id:'S7',ico:'◆',t:B('أسبوع كامل','Une semaine entière'),d:B('سبعة أيام متتالية','Sept jours d\'affilée'),test:()=>streak()>=7},
    {id:'S30',ico:'◆',t:B('شهر من المثابرة','Un mois de persévérance'),d:B('ثلاثون يوما متتاليا','Trente jours d\'affilée'),test:()=>streak()>=30},
    {id:'R5',ico:'↺',t:B('أخطاء تحوّلت إلى مكاسب','Des erreurs devenues des acquis'),d:B('أتقنت 5 أنواع من تمارين كرّاسة الأخطاء','Tu as maîtrisé 5 types d\'exercices du carnet d\'erreurs'),test:()=>P.mast>=5},
    {id:'B1',ico:'▣',t:B('أوّل تمرين بكالوريا مصحَّح','Premier exercice BAC corrigé'),d:B('فتحت كلّ حلول تمرين بكالوريا وصحّحت نفسك','Tu as ouvert tous les corrigés d\'un exercice BAC'),test:()=>Object.values(P.bac).some(x=>x.done)},
    {id:'B6',ico:'▣',t:B('العلامة الكاملة','Note maximale'),d:B('العلامة الكاملة في تمرين بكالوريا','La note maximale à un exercice BAC'),test:()=>Object.values(P.bac).some(x=>x.done&&x.full)},
  ];
  function checkBadges(){
    const fresh=[];
    for(const b of BADGES) if(!P.badges[b.id] && b.test()){ P.badges[b.id]=today(); fresh.push(b); }
    return fresh;
  }
  function exportCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(P)))); }
  function importData(txt){
    let o=null; txt=String(txt||'').trim();
    try{ o=JSON.parse(txt); }catch(e){ try{ o=JSON.parse(decodeURIComponent(escape(atob(txt.replace(/\s+/g,''))))); }catch(e2){ o=null; } }
    if(!o||o.v!==1||typeof o.les!=='object'||!Array.isArray(o.q)) return false;
    P=merge(blank(),o); save(); return true;
  }
  return {
    get P(){ return P; }, persist:()=>persist, save, today, addDays, streak, stars, record, due, upcoming,
    BADGES, checkBadges, exportCode, importData, les,
    reset(){ P=blank(); save(); },
    setSetting(k,v){ P.set[k]=v; save(); },
    bacState(id){ return P.bac[id]||(P.bac[id]={hint:{},sol:{},tick:{},done:false,full:false}); },
    saveBac(){ markDay(); const f=checkBadges(); save(); return f; },
  };
})();

const ptsTxt=p=>`<span class="lat">${String(p).replace('.',',')}</span> ${t('pts')}`;
function bacGot(X,s,i){ return X.parts[i].sol.reduce((a,x,j)=>a+(s.tick[i+'-'+j]?x[1]:0),0); }
function bacScore(X,s){ return X.parts.reduce((a,_,i)=>a+bacGot(X,s,i),0); }
function bacMsg(X,s){
  const done=X.parts.every((_,i)=>s.sol[i]), sc=bacScore(X,s), r=sc/X.pts;
  return !done?t('bacMsgNone'):r>=0.8?t('bacMsgTop'):r>=0.5?t('bacMsgMid'):t('bacMsgLow');
}
function paintBac(l,p){
  const X=BAC[l.id], s=Store.bacState(l.id);
  const sc=()=>`<span class="lat">${String(Math.round(bacScore(X,s)*100)/100).replace('.',',')} / ${X.pts}</span>`;
  let h=`<div class="card scorecard"><div class="exhead"><h3>${tr(X.t)}</h3><span class="ptsb big" id="bacScore">${sc()}</span></div>
    <p class="qtext">${tr(X.st)}</p><p class="note">${t('bacHow')}</p><p class="exsum" id="bacMsg">${bacMsg(X,s)}</p></div>`;
  X.parts.forEach((P,i)=>{
    h+=`<div class="card"><div class="exhead"><h3>${LANG==='ar'?P.n:P.nf}</h3><span class="ptsb">${ptsTxt(P.p)}</span></div>
      <div class="qtext">${tr(P.q)}</div>
      <div class="btnrow noprint"><button class="btn sec2 small" data-bh="${i}">${s.hint[i]?t('hideHint'):t('hint')}</button>
        <button class="btn small" data-bs="${i}">${s.sol[i]?t('hideCorr'):t('corr')}</button></div>
      <div class="hintbox ${s.hint[i]?'on':''}"><b>${t('hint')} :</b> ${tr(P.hint)}</div>
      <div class="solbox ${s.sol[i]?'on':''}"><div class="soltip">${t('tickTip')}</div>
       ${P.sol.map((x,j)=>`<label class="solrow"><input type="checkbox" data-bt="${i}-${j}" ${s.tick[i+'-'+j]?'checked':''}><span class="st2">${tr(x[0])}</span><span class="sp">${ptsTxt(x[1])}</span></label>`).join('')}
       <div class="exsum" id="bsum${i}">${t('qMark')}<b>${ptsTxt(bacGot(X,s,i))}</b> / ${ptsTxt(P.p)}</div></div></div>`;
  });
  h+=`<div class="btnrow noprint"><button class="btn warnb small" id="bacReset">${t('bacReset')}</button></div>`;
  p.innerHTML=fix(h);
  const upd=()=>{ s.done=X.parts.every((_,i)=>s.sol[i]); s.full=s.done&&Math.abs(bacScore(X,s)-X.pts)<1e-9;
    const fr=Store.saveBac(); $('#bacScore').innerHTML=sc(); $('#bacMsg').innerHTML=fix(bacMsg(X,s)); if(fr.length) toastBadges(fr); };
  p.querySelectorAll('[data-bh]').forEach(b=>b.onclick=()=>{ const i=b.dataset.bh; s.hint[i]=!s.hint[i]; Store.save(); paintBac(l,p); });
  p.querySelectorAll('[data-bs]').forEach(b=>b.onclick=()=>{ const i=b.dataset.bs; s.sol[i]=!s.sol[i]; upd(); paintBac(l,p); });
  p.querySelectorAll('[data-bt]').forEach(c=>c.onchange=()=>{ const k=c.dataset.bt, i=+k.split('-')[0]; s.tick[k]=c.checked; upd();
    $('#bsum'+i).innerHTML=fix(`${t('qMark')}<b>${ptsTxt(bacGot(X,s,i))}</b> / ${ptsTxt(X.parts[i].p)}`); });
  $('#bacReset').onclick=()=>{ Object.assign(s,{hint:{},sol:{},tick:{}}); Store.save(); paintBac(l,p); };
}

/* ---------------------- التصحيح: دالة صافية / correction : fonction pure ----------------------
   ترجع {s:'ok'|'bad'|'empty', m:رسالة}. «empty» لا يُحتسب محاولة. */
const DX=m=>`<b>${t('dx')}</b> ${tr(m)}`;
function near(a,b,tol){ return Math.abs(a-b)<=tol; }
function checkAnswer(e,raw,choice){
  if(e.type==='choice'){
    if(!choice) return {s:'empty',m:t('chooseFirst')};
    if(choice===e.ans) return {s:'ok'};
    return {s:'bad',m:(e.why&&e.why[choice])?DX(e.why[choice]):t('wrongChoice')};
  }
  raw=raw==null?'':String(raw);
  if(!raw.trim()) return {s:'empty',m:t('empty')};
  if(e.type==='exprn'){
    if(isNaN(pexprN(raw,1))) return {s:'bad',m:t('exprParse')};
    if(sameSeq(raw,e.fn)) return {s:'ok'};
    for(const [fm,m] of (e.missF||[])) if(!sameFnN(fm,e.fn) && sameSeq(raw,fm)) return {s:'bad',m:DX(m)};
    return {s:'bad',m:t('exprBad')};
  }
  const v=pnum(raw);
  if(isNaN(v)) return {s:'bad',m:t('numParse')};
  const tol=e.tol!=null?e.tol:Math.max(1e-6,Math.abs(e.ans)*1e-9);
  if(near(v,e.ans,tol)) return {s:'ok'};
  for(const [w,m] of (e.miss||[])) if(isFinite(w) && near(v,w,tol) && !near(w,e.ans,tol)) return {s:'bad',m:DX(m)};
  if(near(v,-e.ans,tol)) return {s:'bad',m:DX(t('signWrong'))};
  return {s:'bad',m:t('wrong')};
}
function judge(){
  if(!ex) return;
  const fb=$('#fb');
  if(ex.done){ fb.className='fb good show';
    if(!fb.innerHTML.includes('class="nextnote"')) fb.innerHTML+=fix(`<p class="nextnote">${t('exDone')}</p>`); return; }
  const r=checkAnswer(ex, $('#inp')?$('#inp').value:'', sel);
  if(r.s==='empty'){ fb.className='fb bad show'; fb.innerHTML=fix(`<p>${r.m}</p>`); return; }
  tries++;
  return r.s==='ok'?ok():bad(r.m);
}

function startRun(kind,list){
  if(!list.length) return;
  RUN={mode:kind,items:list.slice(),i:0,ok:0,
    get item(){ return this.items[this.i]; },
    next(){ if(this.i<this.items.length-1){ this.i++; newEx(this.item.lid,this.item.gi); nextLabel(); } else endRun(); },
    bar(){ const n=this.items.length, k=this.i+1;
      return `<div class="runbar"><b>${t('revH')}</b> — ${t('exOf')}<span class="lat">${k}</span>${t('of')}<span class="lat">${n}</span>
        <span class="rbar"><i style="width:${Math.round(100*(this.i)/n)}%"></i></span></div>`; },
    onDone(s){ if(s) this.ok++; },
    after(){ return `<p class="nextnote">${this.i<this.items.length-1?t('pressNext'):t('pressEnd')}</p>`; },
  };
  ex=null; go('practice');
}
function nextLabel(){ const nb=$('#next'); if(nb&&RUN.items) nb.textContent=RUN.i<RUN.items.length-1?t('nextOne'):t('endRun'); }
function endRun(){ const r=RUN; RUN={mode:'done',ok:r.ok,n:r.items.length}; render(); }

/* ---------------------------- القراءة الصوتية / lecture à voix haute ----------------------------
   تعتمد على أصوات الجهاز (Web Speech API): صوت عربي أو فرنسي حسب لغة التطبيق. */
const SP={on:false};
function pickVoice(){
  const ss=window.speechSynthesis; if(!ss||!ss.getVoices) return null;
  const re=LANG==='ar'?/^ar(\b|[-_])/i:/^fr(\b|[-_])/i;
  const v=ss.getVoices().filter(x=>re.test(x.lang||''));
  return LANG==='ar'?(v.find(x=>/DZ|MA|TN/i.test(x.lang))||v.find(x=>/SA/i.test(x.lang))||v[0]||null):(v.find(x=>/FR/i.test(x.lang))||v[0]||null);
}
function speechInfo(){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined') return {ok:false,msg:t('noSpeech')};
  const v=pickVoice();
  return v?{ok:true,msg:`${t('voiceUsed')}<span class="lat">${v.name} (${v.lang})</span>${t('voiceApprox')}`}:{ok:false,msg:t('noVoice')};
}
function chunks(x){
  const out=[]; for(const part of x.replace(/([.!؟?:؛;\n])\s+/g,'$1\u0001').split('\u0001')){ let p=part.trim(); while(p.length>220){ const c=Math.max(p.lastIndexOf('،',220),p.lastIndexOf(',',220)); const k=c>60?c+1:220; out.push(p.slice(0,k)); p=p.slice(k).trim(); } if(p) out.push(p); }
  return out;
}
function speakText(x,onEnd){
  const ss=window.speechSynthesis, v=pickVoice(); if(!ss||!v) return false;
  ss.cancel(); const parts=chunks(x); let i=0;
  const next=()=>{ if(!SP.on) return; if(i>=parts.length){ SP.on=false; if(onEnd) onEnd(); return; }
    const u=new SpeechSynthesisUtterance(parts[i++]); u.voice=v; u.lang=v.lang; u.rate=+Store.P.set.rate||0.9;
    u.onend=next; u.onerror=()=>{ SP.on=false; if(onEnd) onEnd(); }; ss.speak(u); };
  SP.on=true; next(); return true;
}
function paneText(el){
  const fr=LANG==='fr', c=el.cloneNode(true);
  c.querySelectorAll('svg,.ref,button,input,.noread').forEach(x=>x.remove());
  c.querySelectorAll('.fr').forEach(x=>{ const s=x.children; if(s.length===2) x.textContent=' '+s[0].textContent+(fr?' sur ':' على ')+s[1].textContent+' '; });
  c.querySelectorAll('sub').forEach(x=>{ x.textContent=' '+x.textContent+' '; });
  c.querySelectorAll('sup').forEach(x=>{ x.textContent=(fr?' puissance ':' أس ')+x.textContent+' '; });
  c.querySelectorAll('li,p,div,h3,h4,tr').forEach(x=>x.appendChild(document.createTextNode('. ')));
  const R=fr?{'²':' au carré ','×':' fois ','−':' moins ','≤':' inférieur ou égal à ','≥':' supérieur ou égal à ','→':' tend vers ','∞':' l\'infini ','≠':' différent de '}
            :{'²':' مربّع ','×':' ضرب ','−':' ناقص ','≤':' أصغر من أو يساوي ','≥':' أكبر من أو يساوي ','→':' يؤول إلى ','∞':' ما لا نهاية ','≠':' يختلف عن '};
  let s=c.textContent||''; for(const k in R) s=s.split(k).join(R[k]);
  return s.replace(/\s*\.\s*(\.\s*)+/g,'. ').replace(/\s+/g,' ').trim();
}
function stopSpeech(){
  SP.on=false; try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  const b=document.getElementById('spk'); if(b) b.textContent=t('listen');
}
function toggleSpeech(el){
  const b=$('#spk'), m=$('#spkmsg');
  if(SP.on){ stopSpeech(); return; }
  const info=speechInfo(); if(!info.ok){ if(m) m.innerHTML=fix(`<span class="note">${info.msg}</span>`); return; }
  if(m) m.innerHTML='';
  if(speakText(paneText(el),()=>{ if(b) b.textContent=t('listen'); })&&b) b.textContent=t('stopListen');
}

/* ---------------------------- لوحة المفاتيح الرياضية + المسودّة / clavier + brouillon ----------------------------
   على الهاتف (مؤشّر لمسي) تظهر اللوحة مكان لوحة الجهاز، مع زرّ للرجوع إليها. */
const COARSE=(function(){ try{ return !!(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches); }catch(e){ return false; } })();
const PAD_EX={num:['/','(',')','^'],exprn:['n','^','×','(',')','/','+']};
let PADON=null;                                   /* null = حسب الجهاز */
function padOn(){ const s=Store.P.set.pad||'auto'; return PADON!==null?PADON:(s==='on'||(s==='auto'&&COARSE)); }
function padKeys(type){
  const x=(PAD_EX[type]||PAD_EX.num).slice(); while(x.length<9) x.push('');
  return [['7','8','9',x[0],x[1],x[2]],['4','5','6',x[3],x[4],x[5]],['1','2','3',x[6],x[7],x[8]],[',','0','−','◀','▶','⌫']];
}
function padInsert(inp,k){
  const v=inp.value; let a=inp.selectionStart, b=inp.selectionEnd;
  if(a==null||b==null||(document.activeElement!==inp&&!COARSE)){ a=b=v.length; }
  if(k==='⌫'){ if(a===b&&a>0) a--; inp.value=v.slice(0,a)+v.slice(b); setCaret(inp,a); }
  else if(k==='◀'){ setCaret(inp,Math.max(0,a-1)); }
  else if(k==='▶'){ setCaret(inp,Math.min(v.length,b+1)); }
  else { const ins=k==='−'?'-':k; inp.value=v.slice(0,a)+ins+v.slice(b); setCaret(inp,a+ins.length); }
  try{ inp.dispatchEvent(new Event('input',{bubbles:true})); }catch(e){}
}
function setCaret(inp,k){ try{ inp.focus({preventScroll:true}); inp.setSelectionRange(k,k); }catch(e){ try{ inp.setSelectionRange(k,k); }catch(_){} } }
function attachPad(inp,type,box){
  if(!inp||!box) return;
  const on=padOn();
  inp.setAttribute('inputmode',on&&COARSE?'none':'text');
  const wrap=document.createElement('div'); wrap.className='padwrap noprint';
  const keys=padKeys(type).map(r=>r.map(k=>k?`<button type="button" class="pk ${/^[0-9,]$/.test(k)?'d':/[◀▶⌫]/.test(k)?'f':'o'}" data-pk="${k}">${k}</button>`:'<span class="pk e"></span>').join('')).join('');
  wrap.innerHTML=`<div class="padbar"><button type="button" class="btn sec2 small" data-padt="1">${on?(COARSE?t('padDevice'):t('padHide')):t('padShow')}</button></div>
    <div class="pad ${on?'':'off'}" dir="ltr">${keys}</div>`;
  box.appendChild(wrap);
  if(type==='exprn'){                              /* معاينة: كيف سيُقرأ الجواب */
    const pv=document.createElement('div'); pv.className='padpv'; wrap.insertBefore(pv,wrap.firstChild);
    const upd=()=>{ const v=inp.value.trim(); pv.innerHTML=v?t('willRead')+'<span class="m">'+padPreview(v)+'</span>':''; };
    inp.addEventListener('input',upd); upd();
  }
  wrap.querySelectorAll('[data-pk]').forEach(b=>{
    b.addEventListener('pointerdown',e=>e.preventDefault());
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.onclick=()=>padInsert(inp,b.dataset.pk);
  });
  wrap.querySelector('[data-padt]').onclick=()=>{
    PADON=!padOn(); wrap.remove(); attachPad(inp,type,box);
    if(!PADON&&COARSE){ inp.setAttribute('inputmode','text'); try{ inp.blur(); inp.focus(); }catch(e){} }
  };
}
function padPreview(v){
  const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(v).replace(/\*/g,'×').replace(/-/g,'−')
    .replace(/\^\(([^)]*)\)/g,'<sup>$1</sup>').replace(/\^(−?[0-9n]+)/g,'<sup>$1</sup>').replace(/\^/g,'<sup>□</sup>');
}
const SCR={};                                     /* رسومات المسودّة في الذاكرة فقط، حسب التمرين */
function scratchHTML(){ return `<div class="scrbar noprint"><button type="button" class="btn sec2 small" data-scr="1">${t('scr')}</button></div><div class="scrbox noprint"></div>`; }
function wireScratch(root,key){
  const bar=root.querySelector('[data-scr]'), box=root.querySelector('.scrbox'); if(!bar||!box) return;
  const show=()=>{ box.innerHTML=`<div class="scrtools"><button type="button" class="btn small" data-st="pen">${t('pen')}</button><button type="button" class="btn small sec2" data-st="er">${t('eraser')}</button>
      <button type="button" class="btn small sec2" data-st="clr">${t('clearAll')}</button><span class="note">${t('scrNote')}</span></div><canvas class="scr"></canvas>`;
    mountCanvas(box.querySelector('canvas'),key,box); bar.textContent=t('scrHide'); SCR[key+':open']=true; };
  const hide=()=>{ box.innerHTML=''; bar.textContent=t('scr'); SCR[key+':open']=false; };
  bar.onclick=()=>box.firstChild?hide():show();
  if(SCR[key+':open']) show();
}
function mountCanvas(cv,key,box){
  if(!cv.getContext) return;
  const dpr=Math.min(window.devicePixelRatio||1,2), W=cv.clientWidth||320, H=Math.round(Math.min(320,Math.max(200,W*0.55)));
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
  const g=cv.getContext('2d'); g.scale(dpr,dpr); g.lineCap='round'; g.lineJoin='round';
  if(SCR[key]){ const im=new Image(); im.onload=()=>g.drawImage(im,0,0,W,H); im.src=SCR[key]; }
  let mode='pen', last=null;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]; };
  cv.addEventListener('pointerdown',e=>{ last=pos(e); try{ cv.setPointerCapture(e.pointerId); }catch(_){} e.preventDefault(); });
  cv.addEventListener('pointermove',e=>{ if(!last) return; const p=pos(e);
    g.globalCompositeOperation=mode==='er'?'destination-out':'source-over'; g.strokeStyle='#1A2230'; g.lineWidth=mode==='er'?18:2.4;
    g.beginPath(); g.moveTo(last[0],last[1]); g.lineTo(p[0],p[1]); g.stroke(); last=p; e.preventDefault(); });
  const end=()=>{ if(last){ last=null; try{ SCR[key]=cv.toDataURL(); }catch(_){} } };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end); cv.addEventListener('pointerleave',end);
  box.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.st;
    if(k==='clr'){ g.clearRect(0,0,W,H); delete SCR[key]; return; }
    mode=k; box.querySelectorAll('[data-st=pen],[data-st=er]').forEach(x=>x.classList.toggle('sec2',x!==b));
  });
}

/* ---------------------------- تثبيت التطبيق / installation ----------------------------
   Chrome و Edge يطلقان beforeinstallprompt؛ Safari على iPhone لا يدعمه: نعرض الطريقة يدويا. */
const INST={ev:null, done:false};
function instStandalone(){ try{ return !!((window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true); }catch(e){ return false; } }
function instIOS(){ const u=navigator.userAgent||''; return /iPhone|iPad|iPod/.test(u)||(/Macintosh/.test(u)&&(navigator.maxTouchPoints||0)>1); }
function instWeb(){ try{ return location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'; }catch(e){ return false; } }
function instState(){
  if(INST.done||instStandalone()) return 'installed';
  if(INST.ev) return 'ready';
  if(!instWeb()) return 'file';
  return instIOS()?'ios':'menu';
}
function instHidden(){ const x=+(Store.P.set.instX||0); return x&&Date.now()-x<7*864e5; }   /* «لاحقا» تُخفي الشريط أسبوعا */
function instPaint(){
  let b=document.getElementById('instb');
  const st=instState(), show=S.view==='home'&&!instHidden()&&(st==='ready'||st==='ios');
  if(!show){ if(b) b.classList.remove('on'); return; }
  if(!b){ b=document.createElement('div'); b.id='instb'; b.setAttribute('role','region'); document.body.appendChild(b); }
  b.setAttribute('aria-label',t('instH'));
  b.innerHTML=fix(`<span class="ii">📲</span><span class="it"><b>${t('instBarH')}</b><br>${st==='ready'?t('instBarP'):t('instIOS')}</span>
    ${st==='ready'?`<button class="btn small" id="instGo">${t('instBtn')}</button>`:''}<button class="ix" id="instX" aria-label="${t('later')}">×</button>`);
  b.classList.add('on');
  const g=document.getElementById('instGo'); if(g) g.onclick=instAsk;
  document.getElementById('instX').onclick=()=>{ Store.setSetting('instX',Date.now()); instPaint(); };
}
async function instAsk(){
  const ev=INST.ev; if(!ev) return;
  INST.ev=null;                                   /* prompt() مرّة واحدة فقط للحدث نفسه */
  try{ const r=await ev.prompt(); const c=(r&&r.outcome)?r:(ev.userChoice?await ev.userChoice:null);
    if(c&&c.outcome==='dismissed') Store.setSetting('instX',Date.now());
  }catch(e){}
  instPaint(); if(instCardOpen()) openSettings();
}
function instCardHTML(){
  const st=instState();
  const body={installed:`<p class="note">${t('instDone')}</p>`,
    ready:`<p class="note">${t('instReady')}</p><div class="btnrow"><button class="btn small" id="instGo2">${t('instNow')}</button></div>`,
    ios:`<p class="note">${t('instIOS')}</p>`, menu:`<p class="note">${t('instMenu')}</p>`, file:`<p class="note">${t('instFile')}</p>`}[st];
  return `<div class="card" id="instCard"><h3>${t('instH')}</h3>${body}</div>`;
}
function instCardOpen(){ const sh=document.getElementById('sheet'); return !!(sh&&sh.classList.contains('on')&&document.getElementById('instCard')); }
function instWire(){ const b=document.getElementById('instGo2'); if(b) b.onclick=instAsk; }
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); INST.ev=e; instPaint(); if(instCardOpen()) openSettings(); });
window.addEventListener('appinstalled',()=>{ INST.ev=null; INST.done=true; instPaint(); if(instCardOpen()) openSettings();
  toastBadges([{ico:'📲',h:t('instToastH'),t:t('instToast')}]); });

/* ---------------------------- التصيير والتنقّل / rendu et navigation ---------------------------- */
function render(){
  stopSpeech();
  if(S.view==='home') renderHome();
  else if(S.view==='lesson') renderLesson();
  else if(S.view==='quick') renderQuick();
  else if(VIEWS[S.view]) VIEWS[S.view]();
  else { S.view='home'; renderHome(); }
  paintYears(); paintTitle(); instPaint();
  const act={lesson:'home',practice:'progress'}[S.view]||S.view;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===act));
}
function openSheet(html){ $('#sheetin').innerHTML=fix(html); $('#sheet').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); }
function renderNav(){
  $('#nav').innerHTML=[['home','▤'],['quick','✎'],['progress','★'],['settings','⚙']].map(([v,i])=>
    `<button data-v="${v}"><i>${i}</i>${t('nav_'+v)}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
    if(b.dataset.v==='settings') return openSettings();
    if(b.dataset.v==='quick' && RUN.mode!=='free') RUN={mode:'free'};
    go(b.dataset.v); });
  const act={lesson:'home',practice:'progress'}[S.view]||S.view;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===act));
}
$('#home').onclick=()=>go('home');
$('#lng').onclick=()=>setLang(LANG==='ar'?'fr':'ar');
$('#sheet').onclick=e=>{ if(e.target===$('#sheet')) closeSheet(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

applySettings(); applyLang(); render();

</script>
<script>
/* تسجيل عامل الخدمة (يتطلّب https أو localhost) — service worker (https ou localhost) */
(function(){
  if(!('serviceWorker' in navigator)) return;
  var okHost=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(!okHost) return;
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(r){
      r.addEventListener('updatefound',function(){ var w=r.installing; if(!w) return;
        w.addEventListener('statechange',function(){ if(w.state==='installed'&&navigator.serviceWorker.controller&&typeof toastBadges==='function')
          toastBadges([{ico:'↻',h:t('updH'),t:t('upd')}]); }); });
    }).catch(function(){});
  });
})();
</script>

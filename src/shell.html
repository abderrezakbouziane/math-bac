/* تسجيل عامل الخدمة (يتطلّب https أو localhost) — service worker (https ou localhost) */
(function(){
  if(!('serviceWorker' in navigator)) return;
  var okHost=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(!okHost) return;
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(r){
      r.addEventListener('updatefound',function(){ var w=r.installing; if(!w) return;
        w.addEventListener('statechange',function(){ if(w.state==='installed'&&navigator.serviceWorker.controller&&typeof toastBadges==='function')
          toastBadges([{ico:'↻',h:t('updH'),t:t('upd')}]); }); });
    }).catch(function(){});
  });
})();
